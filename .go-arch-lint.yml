version: 3
workdir: .

# ============================================================================
# gobridge architecture policy
#
# This file is the machine-checked expression of three architectural styles
# this project commits to:
#
#   * Clean Architecture (Robert C. Martin)
#       Concentric layers; the Dependency Rule states that source-code
#       dependencies must point inward only. Outer layers know nothing the
#       inner layers do not expose.
#
#   * Hexagonal Architecture (Alistair Cockburn) -- Ports & Adapters
#       The application core sits inside the hexagon; ports define the
#       contracts that cross the boundary; adapters live outside and
#       implement those ports.
#
#   * Domain-Driven Design (Eric Evans)
#       The domain layer is pure (no infrastructure). The ubiquitous
#       language and domain invariants live there. Application services
#       orchestrate use cases over domain types.
#
# Each component declared below is a node in those models, NOT a project
# convenience bucket. Editing this file MUST keep the mapping intact:
# components map to architectural roles, dependencies follow the
# Dependency Rule. See `AGENT.md` for the maintenance contract.
# ============================================================================

allow:
  # Vendor lint enabled: components must explicitly declare every external
  # dependency via canUse. The inner ring is stdlib-only; this is machine-checked, not a wiki claim.
  depOnAnyVendor: false
  # Deep scan: detect cross-component leaks via method calls and structural
  # typing, not only direct imports. Catches phantom dependencies that
  # bypass the import graph.
  deepScan: true
  ignoreNotFoundComponents: false

exclude:
  - .claude
  - .git
  - .worktrees
  - audit
  - domain/clock/clocktest
  - docs
  - ports/storetest
  - reports
  - scripts
  - spec
  - tests
  - testutil

excludeFiles:
  - "^.*_test\\.go$"

# ============================================================================
# Components
#
# Mapping to Clean / Hex / DDD layers:
#
#   Layer 1 -- Enterprise Business Rules (Clean) / Domain (DDD) / Inside the
#              hexagon (Hex)
#       domain_shared        -- shared kernel value objects + errors
#       domain_messaging     -- envelope, headers, transactions
#       domain_persistence   -- outbox, lease, dlq value types
#       domain_routing       -- route policy, slot allocation
#       domain_connectivity  -- credentials, health
#       domain_events        -- first-wave domain events (past-tense facts)
#       domain_clock         -- time abstraction (stdlib-only)
#
#   Layer 2 -- Application Business Rules / Use Cases (Clean) /
#              Application services (DDD) / Inside the hexagon (Hex)
#       ports         -- Driving + driven port interfaces
#       config        -- Inner-ring shared kernel: pure validation,
#                        merge, and Manager over *ports.BridgeConfig
#                        (stdlib-only; no vendor concession)
#       config_parser -- Wire-format adapter for `config`: YAML / JSON
#                        parsing, RawConfig.Decode (mapstructure),
#                        wire-format marshallers, FileStore. The only
#                        Layer-2 location permitted to import
#                        yaml.v3 / mapstructure (W-9 / L-2 split)
#       runtime       -- Use case orchestration (route execution engine)
#       bridge        -- Composition factory: assembles use cases from
#                        config
#       validate      -- Use case helpers: invariants over ports + domain
#
#   Layer 3 -- Interface Adapters (Clean) / Adapters (Hex) /
#              Infrastructure (DDD)
#       httpapi             -- Driving adapter (HTTP delivery mechanism)
#       processor_*         -- In-process driven adapters (message
#                              transformation chain). One component per
#                              processor role (filter, tenant, transform,
#                              circuitbreaker) so the same anti-coupling
#                              rule that protects transports/stores also
#                              protects sibling processors.
#       adapter_transport_* -- Driven adapters: message transport
#       adapter_store_*     -- Driven adapters: persistence
#       adapter_config_*    -- Driving adapters: configuration sources
#       adapter_credentials_* -- Driven adapters: secret resolution
#       adapter_metrics_* / adapter_tracing_* -- Driven adapters:
#                              observability export
#       adapter_cluster_*   -- Driven adapters: cluster topology
#
#   Layer 4 -- Frameworks & Drivers (Clean) / Composition root /
#              Outside everything
#       cmd
#       deployment
#
#   Cross-cutting utilities (technically inside Layer 1/2 because they
#   carry no infrastructure dependencies, used by any layer above):
#       logging         -- slog wrapper providing TRACE level
#       observability   -- slog correlation handler
#       circuitbreaker  -- domain stability primitive (state machine)
#
# Adapter components are split by technology to enforce the hexagonal
# rule that each port may have multiple independent adapters: a bug in
# one transport adapter must never propagate via shared imports to
# another.
# ============================================================================
components:
  # ---- Layer 1: Domain (decomposed by bounded context) ----
  # The catch-all `domain` component has been removed (FIX-004 Phase 5).
  # Every domain type now belongs to exactly one bounded-context
  # sub-package: shared, messaging, persistence, routing, connectivity,
  # or clock. The cfgshape tests in scripts/lint-arch-mapping-test.sh
  # assert each context has a sentinel package mapped to it so the YAML
  # cannot drift from the package layout.
  domain_shared: { in: [domain/shared, domain/shared/**] }
  domain_messaging: { in: [domain/messaging, domain/messaging/**] }
  domain_persistence: { in: [domain/persistence, domain/persistence/**] }
  domain_routing: { in: [domain/routing, domain/routing/**] }
  domain_connectivity: { in: [domain/connectivity, domain/connectivity/**] }
  domain_events: { in: [domain/events, domain/events/**] }
  # domain/clock is a stdlib-only timing primitive shared across the
  # core ring; clocktest helper lives outside this component (excluded
  # at the top of the file).
  domain_clock: { in: [domain/clock] }

  # ---- Layer 2: Ports + Application Services + Shared Kernel ----
  ports: { in: [ports, ports/**] }
  # The pure (vendor-free) inner-ring shared kernel: validation,
  # merge, manager. The W-9 finding was resolved (L-2) by extracting
  # the YAML / JSON parser and FileStore into the sibling
  # `config_parser` component below; this `config` component is now
  # stdlib-only and carries NO vendor concession.
  config: { in: [config] }
  config_parser: { in: [config/parser] }
  runtime: { in: [runtime] }
  runtime_dlq: { in: [runtime/dlq] }
  runtime_credentials: { in: [runtime/credentials] }
  runtime_cluster: { in: [runtime/cluster] }
  runtime_session: { in: [runtime/session] }
  runtime_outbox: { in: [runtime/outbox] }
  runtime_route: { in: [runtime/route] }
  bridge: { in: [bridge, bridge/**] }
  validate: { in: [validate, validate/**] }

  # ---- Cross-cutting utilities ----
  logging: { in: [logging, logging/**] }
  observability: { in: [observability, observability/**] }
  circuitbreaker: { in: [circuitbreaker, circuitbreaker/**] }

  # ---- Layer 3: Interface Adapters ----
  # Driving adapter: HTTP admin / monitor delivery mechanism.
  httpapi: { in: [httpapi, httpapi/**] }

  # In-process processor adapters (message-transformation chain). One
  # component per role so a future processor cannot quietly import a
  # sibling processor's internals -- the same anti-sibling-coupling
  # rule that protects transport_* and store_* siblings (see F-001).
  processor_filter:         { in: [processors/filter, processors/filter/**] }
  processor_tenant:         { in: [processors/tenant, processors/tenant/**] }
  processor_transform:      { in: [processors/transform, processors/transform/**] }
  processor_circuitbreaker: { in: [processors/circuitbreaker, processors/circuitbreaker/**] }

  # Driven adapters: message transport. One component per technology so
  # that a flaw in one adapter cannot leak into another via shared types.
  adapter_transport_mqtt_paho: { in: [adapters/mqtt/transport/paho] }
  adapter_transport_sqs: { in: [adapters/aws/transport/sqs] }
  adapter_transport_servicebus: { in: [adapters/azure/transport/servicebus] }
  adapter_transport_amqp091: { in: [adapters/amqp/transport/amqp091] }
  adapter_transport_amqp10: { in: [adapters/amqp/transport/amqp10] }
  adapter_transport_http: { in: [adapters/http/transport] }

  # Driven adapters: persistence implementations. One component per
  # backing store so that, e.g., the SQLite outbox cannot accidentally
  # depend on the DynamoDB lease store.
  adapter_store_native_memorylease: { in: [adapters/native/store/memorylease] }
  adapter_store_native_memoryoutbox:
    { in: [adapters/native/store/memoryoutbox] }
  adapter_store_native_memorydlq: { in: [adapters/native/store/memorydlq] }
  adapter_store_native_sqliteoutbox:
    { in: [adapters/native/store/sqliteoutbox] }
  adapter_store_native_sqlitedlq: { in: [adapters/native/store/sqlitedlq] }
  adapter_store_aws_dynamodblease: { in: [adapters/aws/store/dynamodblease] }
  adapter_store_aws_dynamodboutbox: { in: [adapters/aws/store/dynamodboutbox] }
  adapter_store_aws_dynamodbdlq: { in: [adapters/aws/store/dynamodbdlq] }

  # Aggregator components: the only place allowed to import its own
  # store implementations. This expresses the hexagonal rule that an
  # adapter implementation MUST NOT depend on its aggregator (no upward
  # references) but the aggregator MAY depend on its implementations.
  adapter_store_native_factory: { in: [adapters/native/store] }
  adapter_store_aws_factory: { in: [adapters/aws/store] }

  # Driving adapters that produce a *config.BridgeConfig. These are the
  # single adapter category permitted to import the `config` shared
  # kernel because that IS their reason to exist.
  adapter_config_native_file: { in: [adapters/native/config/file] }
  adapter_config_aws_dynamodb: { in: [adapters/aws/config/dynamodb] }

  # Driven adapters: credential resolution.
  adapter_credentials_native_file: { in: [adapters/native/credentials/file] }
  adapter_credentials_aws_ssm: { in: [adapters/aws/credentials/ssm] }

  # Driven adapters: observability export.
  adapter_metrics_cloudwatch: { in: [adapters/aws/metrics/cloudwatch] }
  adapter_metrics_otel: { in: [adapters/otel/metrics] }
  adapter_tracing_otel: { in: [adapters/otel/tracing] }

  # Driven adapters: cluster topology resolution.
  adapter_cluster_native: { in: [adapters/native/cluster] }
  adapter_cluster_aws: { in: [adapters/aws/cluster/ecs] }

  # ---- Layer 4: Frameworks & Drivers (composition root) ----
  cmd: { in: [cmd, cmd/**] }
  deployment: { in: [deployment, deployment/**] }

# ============================================================================
# Vendor whitelist
#
# Each named entry is a vendor library this codebase is permitted to use.
# Components opt in via `canUse:`. Adding a new vendor requires an
# explicit, reviewable line here; this is the architectural admission
# control for external dependencies.
# ============================================================================
vendors:
  # Sentinel used to satisfy the lint-schema "at least one entry"
  # requirement for components that intentionally have no vendor
  # imports. The pattern matches no real import path; if any external
  # dep is added to such a component the lint will fail and force the
  # component policy to be updated, making the breach reviewable.
  _no_external_deps_: { in: __no_external_deps_sentinel__ }

  # config_parser concession: the wire-format adapter parses YAML /
  # JSON. This is the only Layer-2 component allowed to import yaml.v3
  # (the prior `config` shared kernel carve-out was narrowed to this
  # adapter component by L-2 / W-9).
  yaml: { in: gopkg.in/yaml.v3 }
  # config_parser concession: typed plugin option decoding for the
  # two-stage parser (FIX-003). mapstructure honours `json:"..."` tags
  # (the repo-wide adapter Config convention) which yaml.v3 alone does
  # not. Restricted to config_parser just like yaml.
  mapstructure: { in: github.com/go-viper/mapstructure/v2 }

  # NOTE on encoding/json (FIX-003 Phase 5):
  # go-arch-lint's vendor lint governs only third-party imports; stdlib
  # packages are exempt and cannot be denied via `vendors:` / `canUse:`.
  # The architectural intent -- domain and ports MUST NOT depend on
  # encoding/json -- is therefore enforced by the `cfgshape` analyzer
  # for inner-ring `json.RawMessage` denial and by code review for the
  # broader `encoding/json` ban. The blueprint marshallers that
  # historically lived in ports/ have been relocated to config/ to keep
  # the inner ring format-neutral.

  # Adapter SDKs.
  fsnotify: { in: github.com/fsnotify/fsnotify }
  paho: { in: ["github.com/eclipse/paho.golang/**"] }
  amqp091: { in: github.com/rabbitmq/amqp091-go }
  amqp10: { in: github.com/Azure/go-amqp }
  asb:
    {
      in:
        [
          "github.com/Azure/azure-sdk-for-go/**",
          "github.com/Azure/azure-amqp-common-go/**",
        ],
    }
  aws:
    { in: ["github.com/aws/aws-sdk-go-v2/**", "github.com/aws/smithy-go/**"] }
  sqlite: { in: ["modernc.org/sqlite", "modernc.org/sqlite/lib"] }
  otel:
    {
      in:
        [
          "go.opentelemetry.io/otel/**",
          "go.opentelemetry.io/proto/**",
          "google.golang.org/grpc/**",
          "google.golang.org/protobuf/**",
          "google.golang.org/genproto/**",
        ],
    }

  # Processor-specific.
  ojg: { in: ["github.com/ohler55/ojg/**"] }

# ============================================================================
# Dependency rules
#
# The Dependency Rule (Clean Architecture): source-code dependencies
# point inward. Each rule below either expresses an inward dependency,
# or a constrained sideways dependency (cross-cutting utility, shared
# kernel, or aggregator -> implementation).
# ============================================================================
deps:
  # ---- Layer 1: Domain ----
  # Domain is the innermost layer. It has no project dependencies and no
  # external dependencies. The sentinel vendor entry makes the
  # zero-dependency claim machine-checked.
  domain_shared:
    canUse: [_no_external_deps_]
  domain_messaging:
    canUse: [_no_external_deps_]
  domain_persistence:
    mayDependOn:
      - domain_shared
      - domain_messaging
    canUse: [_no_external_deps_]
  domain_routing:
    mayDependOn:
      - domain_shared
      - domain_messaging
    canUse: [_no_external_deps_]
  domain_connectivity:
    mayDependOn:
      - domain_shared
    canUse: [_no_external_deps_]
  # domain_events publishes past-tense facts emitted by aggregates in
  # the persistence, routing, connectivity, and configuration
  # bounded contexts. The events themselves carry primitive payload
  # fields only -- they MUST NOT depend on other domain bounded
  # contexts so consumers can deserialise them without dragging a
  # producer's dependency graph along.
  domain_events:
    canUse: [_no_external_deps_]
  # NOTE on domain_persistence (FIX-004 Phase 5):
  # The strict reading of FIX-004 lists `domain_persistence: { mayDependOn:
  # [domain_shared] }`. In practice OutboxRecord embeds a messaging.Envelope
  # because an outbox record IS a persisted envelope; banning that edge
  # would force the persistence model to carry an opaque payload-bytes +
  # headers map and reconstruct an Envelope at every use site. We keep
  # the persistence -> messaging edge as it expresses a real domain
  # invariant. The other contexts follow the strict spec.
  domain_clock:
    canUse: [_no_external_deps_]

  # ---- Layer 2: Ports + Application Services + Shared Kernel ----

  # Ports define the contracts adapters implement. They reference domain
  # value objects only; they MUST NOT know about config, runtime,
  # bridge, or any adapter. Per FIX-003 Phase 5 the inner ring is
  # format-neutral: ports does NOT carry yaml/json/mapstructure runtime
  # dependencies. Wire-format marshalling lives in config/.
  ports:
    mayDependOn:
      - domain_clock
      - domain_shared
      - domain_messaging
      - domain_persistence
      - domain_routing
      - domain_connectivity
      - domain_events
    canUse:
      - _no_external_deps_

  # The config package is the inner-ring shared kernel: field-level
  # structural validation (required fields, enum values, duration
  # formats), layered merge, and the multi-source Manager that
  # produces *ports.BridgeConfig values. It contributes only pure
  # behaviour over ports; the YAML/JSON parser and FileStore live in
  # the sibling `config_parser` component which holds the only
  # remaining vendor concession (yaml.v3, mapstructure). This
  # component is stdlib-only -- the W-9 inner-ring vendor carve-out
  # was removed by L-2. As of L-3 it MAY depend on `validate` because
  # cross-reference / route-graph validation now lives there
  # (config.Validate composes field-level checks with
  # validate.ValidateBlueprintGraph).
  config:
    mayDependOn:
      - domain_clock
      - domain_shared
      - domain_messaging
      - domain_persistence
      - domain_routing
      - domain_connectivity
      - domain_events
      - ports
      - validate
    canUse:
      - _no_external_deps_

  # The config_parser package is the wire-format adapter: YAML / JSON
  # parsing (two-stage decode through *ports.Registry), the typed
  # RawConfig.Decode based on mapstructure, the wire-format
  # marshallers, atomic on-disk writes, and the FileStore
  # ports.ConfigStore implementation. It is the only Layer-2
  # location permitted to import yaml.v3 or mapstructure (the
  # historical "shared kernel vendor concession" was narrowed to
  # this component by L-2 / W-9). It MUST NOT depend on runtime,
  # bridge, or any adapter; it MAY depend on `config` because
  # FileStore composes Validate / DefaultMerge from the model.
  config_parser:
    mayDependOn:
      - config
      - domain_clock
      - domain_shared
      - domain_messaging
      - domain_persistence
      - domain_routing
      - domain_connectivity
      - domain_events
      - ports
    canUse:
      - yaml
      - mapstructure

  # Cross-cutting utilities. None of them carry external dependencies.
  logging:
    canUse: [_no_external_deps_]
  observability:
    canUse: [_no_external_deps_]
  # circuitbreaker may depend on ports because *Breaker satisfies the
  # ports.CircuitBreaker contract — adapters depend on the port only,
  # never on this package directly.
  circuitbreaker:
    mayDependOn:
      - domain_clock
      - domain_shared
      - domain_messaging
      - domain_persistence
      - domain_routing
      - domain_connectivity
      - domain_events
      - ports

  # validate hosts invariants over ports + domain. It MUST NOT depend on
  # config (validators receive ports.*Spec values, not config.*Def),
  # runtime, or bridge.
  validate:
    mayDependOn:
      - domain_clock
      - domain_shared
      - domain_messaging
      - domain_persistence
      - domain_routing
      - domain_connectivity
      - domain_events
      - ports

  # runtime is the use-case engine. Per the Dependency Rule it depends
  # only on inward layers. logging + observability are cross-cutting
  # utilities; they carry no infrastructure.
  runtime:
    mayDependOn:
      - domain_clock
      - domain_shared
      - domain_messaging
      - domain_persistence
      - domain_routing
      - domain_connectivity
      - ports
      - logging
      - observability
      - runtime_dlq
      - runtime_cluster
      - runtime_session
      - runtime_outbox
      - runtime_route

  # runtime_dlq is the dead-letter-queue routing leaf. It owns the
  # asynchronous DLQ router (classify -> enqueue -> drain to DLQStore)
  # and depends only on inward layers + the DLQStore port. It MUST NOT
  # depend on its parent (runtime) -- the dependency direction is
  # parent -> leaf only -- nor on any adapter, bridge, or composition
  # root code. Treat any new outward edge here as a smell that the
  # leaf is absorbing orchestration concerns it should publish back
  # to runtime instead.
  runtime_dlq:
    mayDependOn:
      - domain_clock
      - domain_shared
      - domain_messaging
      - domain_persistence
      - domain_routing
      - ports

  # runtime_cluster owns the runtime's cluster-coordination primitives:
  # the route-ownership locator that combines lease state with the
  # route → session mapping to decide whether this instance handles a
  # given route or forwards to the peer that holds the lease. The
  # parent runtime composes a *cluster.Locator and exposes it through
  # the ports.RouteLocator interface; the dependency direction is
  # parent -> leaf only. This leaf MUST NOT depend on its parent
  # (runtime), on any adapter, on bridge, or on the composition root.
  # Treat any new outward edge here as a smell that the leaf is
  # absorbing orchestration concerns it should publish back to runtime
  # instead.
  runtime_cluster:
    mayDependOn:
      - domain_clock
      - domain_persistence
      - ports

  # runtime_session owns the session-lifecycle primitives: lease
  # acquisition, renewal, three-phase step-down, reconnect reconcile,
  # and the lease-state event stream the parent runtime observes. The
  # parent runtime composes a *session.Manager and consumes it through
  # the standard inward dependency rule (parent -> leaf); this leaf
  # MUST NOT depend on its parent (runtime), on any adapter, on
  # bridge, or on the composition root. Treat any new outward edge
  # here as a smell that the leaf is absorbing orchestration concerns
  # it should publish back to runtime instead.
  runtime_session:
    mayDependOn:
      - domain_clock
      - domain_shared
      - domain_persistence
      - domain_routing
      - domain_connectivity
      - ports
      - logging

  # runtime_outbox owns the runtime-side outbox dispatch plumbing: the
  # per-partition Drainer that claims pending OutboxRecords, validates
  # fencing tokens, sends through the target Sender, and routes
  # terminal failures to the DLQ; the DepthCache that short-circuits
  # repeated QueryPending calls on the shared-outbox hot path; and the
  # timeout-scaling helper. The OutboxRecord aggregate itself remains
  # in domain/persistence. The parent runtime composes a *outbox.Drainer
  # per shared-outbox session and consumes it through the standard
  # inward dependency rule (parent -> leaf); this leaf MUST NOT depend
  # on its parent (runtime), on any adapter, on bridge, or on the
  # composition root. It MAY depend on the sibling runtime_dlq leaf
  # for terminal-failure routing.
  runtime_outbox:
    mayDependOn:
      - domain_clock
      - domain_shared
      - domain_messaging
      - domain_persistence
      - domain_routing
      - ports
      - logging
      - runtime_dlq

  # runtime_route owns the runtime's per-route ingress execution
  # pipeline: the processor chain (with panic and timeout recovery),
  # the RouteRunner that drives the configured Receiver, and the
  # dispatch path that resolves DispatchPlans, renders binding
  # addresses, and either sends directly (DirectHold) or persists into
  # the OutboxStore (SharedOutbox). Per-record retry/backoff, DLQ
  # classification, and idle signalling all live here. The parent
  # runtime composes a *route.RouteRunner per RouteConfig and consumes
  # it through the standard inward dependency rule (parent -> leaf);
  # this leaf MUST NOT depend on its parent (runtime), on its sibling
  # runtime_session / runtime_cluster / runtime_credentials leaves, on
  # any adapter, on bridge, or on the composition root. It MAY depend
  # on the sibling runtime_dlq and runtime_outbox leaves it dispatches
  # through.
  runtime_route:
    mayDependOn:
      - domain_clock
      - domain_shared
      - domain_messaging
      - domain_persistence
      - domain_routing
      - ports
      - logging
      - observability
      - runtime_dlq
      - runtime_outbox

  # runtime_credentials is the credential-store adaptation leaf
  # (PollBasedWrapper lifts a PullCredentialStore into a
  # PushCredentialStore). It lives outside the core runtime engine so
  # the composition root can import it without dragging in the route
  # execution machinery, and it is referenced ONLY by `bridge`. It
  # MUST NOT depend on its sibling `runtime` -- the dependency
  # direction is composition-root -> leaf only -- nor on any adapter
  # or bridge code.
  runtime_credentials:
    mayDependOn:
      - domain_clock
      - domain_shared
      - domain_connectivity
      - ports

  # bridge is the composition factory: it reads ports.BridgeConfig and
  # builds a runtime.Runtime. It MUST NOT depend on the config parser
  # package (the composition root injects a ports.BlueprintValidator
  # via WithBlueprintValidator) and MUST NOT depend on any adapter.
  bridge:
    mayDependOn:
      - domain_clock
      - domain_shared
      - domain_messaging
      - domain_persistence
      - domain_routing
      - domain_connectivity
      - domain_events
      - logging
      - ports
      - runtime
      - runtime_credentials
      - runtime_session

  # ---- Layer 3: Interface Adapters ----

  # httpapi is a driving adapter (HTTP delivery mechanism). It exposes
  # admin/monitor over the runtime use cases and consumes the
  # ports.ConfigStore boundary for the config admin transactions API.
  # It MUST NOT depend on the config parser package directly (the
  # composition root injects a ports.ConfigStore implementation via
  # httpapi.Config.ConfigStore). It MUST NOT depend on any other
  # adapter.
  httpapi:
    mayDependOn:
      - domain_clock
      - domain_shared
      - domain_messaging
      - domain_persistence
      - domain_routing
      - domain_connectivity
      - domain_events
      - logging
      - observability
      - ports
      - runtime

  # Processors are in-process driven adapters that participate in the
  # message-transformation chain. Each processor is its own component so
  # that, e.g., processors/filter cannot quietly import internals of
  # processors/transform (the same anti-sibling-coupling rule the
  # transport_* and store_* components enforce).
  #
  # Allowed cross-edges:
  #   * processor_circuitbreaker may import the `circuitbreaker` utility
  #     because circuit breaking IS its job; no other processor may.
  #   * processor_transform may use the `ojg` JSONPath vendor; no other
  #     processor may.
  # Every processor depends on ports + the domain bounded contexts it
  # actually needs and MUST NOT depend on transport, store, httpapi,
  # bridge, runtime, config, or any other adapter.
  processor_filter:
    mayDependOn:
      - domain_shared
      - domain_messaging
      - ports
    canUse: [_no_external_deps_]

  processor_tenant:
    mayDependOn:
      - domain_shared
      - domain_messaging
      - ports
    canUse: [_no_external_deps_]

  processor_transform:
    mayDependOn:
      - domain_messaging
      - ports
    canUse:
      - ojg

  processor_circuitbreaker:
    mayDependOn:
      - circuitbreaker
      - domain_clock
      - domain_shared
      - domain_messaging
      - ports
    canUse: [_no_external_deps_]

  # ---- Layer 3: Driven adapters -- message transport ----
  #
  # Each transport adapter depends only on ports + domain (with logging
  # for diagnostics). It MUST NOT depend on bridge, config, runtime, or
  # any other transport. Vendor SDKs are listed explicitly so swapping
  # SDKs is a reviewable policy change.
  #
  # A transport may opt into the `circuitbreaker` cross-cutting utility
  # only when its implementation actually uses it; absent that, the
  # rule is removed to prevent accidental coupling.

  # MQTT Paho wraps its sender in a circuit breaker (cb_sender.go) but
  # consumes the ports.CircuitBreaker contract only — the implementation
  # is supplied by the composition root.
  adapter_transport_mqtt_paho:
    mayDependOn: [domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
    canUse: [paho]

  adapter_transport_sqs:
    mayDependOn: [domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
    canUse: [aws]

  adapter_transport_servicebus:
    mayDependOn: [domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
    canUse: [asb]

  adapter_transport_amqp091:
    mayDependOn: [domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
    canUse: [amqp091]

  adapter_transport_amqp10:
    mayDependOn: [domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
    canUse: [amqp10]

  # HTTP transport is stdlib-only.
  adapter_transport_http:
    mayDependOn: [domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]

  # ---- Layer 3: Driven adapters -- store implementations ----
  #
  # Store impls are leaves of the adapter graph: they implement a port
  # and depend on nothing else. They MUST NOT import their aggregator;
  # the aggregator imports them, never the reverse.

  adapter_store_native_memorylease:
    mayDependOn: [domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
  adapter_store_native_memoryoutbox:
    mayDependOn: [domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
  adapter_store_native_memorydlq:
    mayDependOn: [domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
  adapter_store_native_sqliteoutbox:
    mayDependOn: [domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
    canUse: [sqlite]
  adapter_store_native_sqlitedlq:
    mayDependOn: [domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
    canUse: [sqlite]
  adapter_store_aws_dynamodblease:
    mayDependOn: [domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
    canUse: [aws]
  adapter_store_aws_dynamodboutbox:
    mayDependOn: [domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
    canUse: [aws]
  adapter_store_aws_dynamodbdlq:
    mayDependOn: [domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
    canUse: [aws]

  # ---- Layer 3: Store factory aggregators ----
  #
  # Aggregators are the single category permitted to import their own
  # store implementations. This is the only "outward" sideways rule in
  # the policy: a logical inversion -- the aggregator presents a single
  # ports.StoreFactory port to the application by composing several
  # leaf implementations.
  adapter_store_native_factory:
    mayDependOn:
      - domain_clock
      - domain_shared
      - domain_messaging
      - domain_persistence
      - domain_routing
      - domain_connectivity
      - domain_events
      - logging
      - ports
      - adapter_store_native_memorylease
      - adapter_store_native_memoryoutbox
      - adapter_store_native_memorydlq
      - adapter_store_native_sqliteoutbox
      - adapter_store_native_sqlitedlq

  adapter_store_aws_factory:
    mayDependOn:
      - domain_clock
      - domain_shared
      - domain_messaging
      - domain_persistence
      - domain_routing
      - domain_connectivity
      - domain_events
      - logging
      - ports
      - adapter_store_aws_dynamodblease
      - adapter_store_aws_dynamodboutbox
      - adapter_store_aws_dynamodbdlq
    canUse: [aws]

  # ---- Layer 3: Config-source adapters ----
  #
  # The single adapter category permitted to import the `config` and
  # `config_parser` shared-kernel packages. Their job is to produce
  # *ports.BridgeConfig from an external source (file, DynamoDB, …)
  # using ParseFile / Parse / MarshalYAML / MarshalBridgeConfigJSON
  # from `config_parser` and the structural Validate / DefaultMerge
  # helpers from `config`. They depend on ports for the data shape
  # (BridgeConfig + Loader/Watcher/Reloader contracts).
  #
  # The native file adapter is parser-only today (Format / ParseFile);
  # the DynamoDB loader is also parser-only (Parse +
  # MarshalBridgeConfigJSON). Both list `config` in addition so they
  # remain free to invoke Validate / DefaultMerge without a separate
  # rule edit.
  adapter_config_native_file:
    mayDependOn: [config, config_parser, domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
    canUse: [fsnotify]
  adapter_config_aws_dynamodb:
    mayDependOn: [config, config_parser, domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
    canUse: [aws]

  # ---- Layer 3: Credential adapters ----
  adapter_credentials_native_file:
    mayDependOn: [domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
  adapter_credentials_aws_ssm:
    mayDependOn: [domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
    canUse: [aws]

  # ---- Layer 3: Observability adapters ----
  adapter_metrics_cloudwatch:
    mayDependOn: [domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
    canUse: [aws]
  adapter_metrics_otel:
    mayDependOn: [domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
    canUse: [otel]
  adapter_tracing_otel:
    mayDependOn: [domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
    canUse: [otel]

  # ---- Layer 3: Cluster resolver adapters ----
  adapter_cluster_native:
    mayDependOn: [domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
  adapter_cluster_aws:
    mayDependOn: [domain_shared, domain_messaging, domain_persistence, domain_routing, domain_connectivity, domain_events, domain_clock, logging, ports]
    canUse: [aws]

  # ---- Layer 4: Composition root ----
  #
  # cmd and deployment are the outermost layer. They wire concrete
  # adapters into the bridge builder; they may import any project
  # package and any vendor library. There is no architectural reason
  # to constrain them: they ARE the boundary between the architecture
  # and the operating environment.
  cmd:
    anyProjectDeps: true
    anyVendorDeps: true

  deployment:
    anyProjectDeps: true
    anyVendorDeps: true
