securitySchemes:
  ApiKeyAuth:
    type: apiKey
    in: header
    name: X-API-Key
    description: >
      API key passed in the `X-API-Key` header. Must be at least 16 characters.
      Compared using SHA-256 constant-time comparison.
  BearerAuth:
    type: http
    scheme: bearer
    description: >
      Bearer token in the `Authorization` header. The token value must match
      the configured API key. Compared using SHA-256 constant-time comparison.

parameters:
  RouteID:
    name: routeID
    in: path
    required: true
    description: Unique identifier of the target route.
    schema:
      type: string
    example: mqtt-to-sqs
  DLQMessageID:
    name: id
    in: path
    required: true
    description: Unique identifier of a DLQ entry.
    schema:
      type: string
    example: dlq-001

responses:
  Unauthorized:
    description: Invalid or missing API key.
    headers:
      WWW-Authenticate:
        schema:
          type: string
          example: Bearer realm="gobridge-admin"
    content:
      application/json:
        schema:
          $ref: "#/schemas/ErrorResponse"
        example: { "error": "invalid or missing API key" }

  UnauthorizedMonitor:
    description: Invalid or missing API key (monitor realm).
    headers:
      WWW-Authenticate:
        schema:
          type: string
          example: Bearer realm="gobridge-monitor"
    content:
      application/json:
        schema:
          $ref: "#/schemas/ErrorResponse"
        example: { "error": "invalid or missing API key" }

  NoDLQStore:
    description: No DLQ store is configured on this instance.
    content:
      application/json:
        schema:
          $ref: "#/schemas/ErrorResponse"
        example: { "error": "no DLQ store configured" }

  TooManyRequests:
    description: >
      The client exceeded the authentication-failure limit (AuthFailureLimit,
      default 5) within the failure window (AuthFailureWindow, default 1m) and
      is temporarily throttled. Applies to every authenticated admin and
      monitor endpoint. The client identity is the leftmost X-Forwarded-For hop
      (when present) else RemoteAddr.
    headers:
      Retry-After:
        schema:
          type: string
          example: "60"
    content:
      application/json:
        schema:
          $ref: "#/schemas/ErrorResponse"
        example: { "error": "too many failed authentication attempts" }

  RuntimeUnavailable:
    description: >
      Runtime is not available. Returned during startup before the first
      runtime has been built, or during a config-driven runtime swap.
    content:
      application/json:
        schema:
          $ref: "#/schemas/ErrorResponse"
        example: { "error": "runtime not available" }

  BridgeStatusResponse:
    description: Bridge status.
    content:
      application/json:
        schema:
          $ref: "#/schemas/BridgeStatus"

schemas:
  ErrorResponse:
    type: object
    required: [error]
    properties:
      error:
        type: string
        description: Human-readable error message.
        example: invalid or missing API key

  StatusMessage:
    type: object
    required: [status]
    properties:
      status:
        type: string
        description: Operation result status.
        example: started

  BridgeStatus:
    type: object
    required: [instance_id, running, routes]
    properties:
      instance_id:
        type: string
        description: Unique identifier for this bridge instance.
        example: gobridge-1
      running:
        type: boolean
        description: Whether the bridge runtime is currently running.
        example: true
      routes:
        type: integer
        description: Number of configured routes.
        example: 3

  RouteView:
    type: object
    required: [id, delivery_mode, dispatch_mode, max_in_flight]
    description: Compact route summary used by admin endpoints.
    properties:
      id:
        type: string
        description: Route identifier.
        example: mqtt-to-sqs
      delivery_mode:
        type: string
        description: >
          Delivery strategy. `direct_hold` processes synchronously;
          `shared_outbox` uses durable async delivery.
        enum: [direct_hold, shared_outbox]
        example: direct_hold
      dispatch_mode:
        type: string
        description: How messages are dispatched to senders (parallel or sequential).
        enum: [parallel, sequential]
        example: parallel
      max_in_flight:
        type: integer
        description: Maximum concurrent messages allowed on this route.
        example: 100

  TopologyRouteView:
    type: object
    required: [id, delivery_mode, dispatch_mode]
    description: Compact route view for topology responses (no policy detail).
    properties:
      id:
        type: string
        description: Route identifier.
        example: mqtt-to-sqs
      delivery_mode:
        type: string
        enum: [direct_hold, shared_outbox]
        example: direct_hold
      dispatch_mode:
        type: string
        enum: [parallel, sequential]
        example: parallel

  TopologyResponse:
    type: object
    required: [instance_id, running, routes]
    description: Cluster topology view for a single bridge instance.
    properties:
      instance_id:
        type: string
        description: Unique identifier for this bridge instance.
        example: gobridge-1
      running:
        type: boolean
        description: Whether the bridge runtime is currently running.
        example: true
      routes:
        type: array
        description: Routes configured on this instance.
        items:
          $ref: "#/schemas/TopologyRouteView"
      config_version:
        type: integer
        description: >
          Optimistic-concurrency version of the running configuration, as
          reported by the wired config provider. Additive and optional:
          present only when a config source is available (omitted otherwise,
          so a missing provider is not confused with version 0). When several
          instances share one config file, a lagging config_version identifies
          an instance that has not yet converged on the latest committed
          configuration. A zero value means the config has never been
          committed via the transaction API.
        example: 7

  MonitorRouteView:
    type: object
    required: [id, delivery_mode, dispatch_mode, max_in_flight, max_replay, ack_after, on_expired, on_perm_failure]
    description: Detailed route view with full policy information.
    properties:
      id:
        type: string
        description: Route identifier.
        example: mqtt-to-sqs
      delivery_mode:
        type: string
        enum: [direct_hold, shared_outbox]
        example: direct_hold
      dispatch_mode:
        type: string
        enum: [parallel, sequential]
        example: parallel
      max_in_flight:
        type: integer
        description: Maximum concurrent messages allowed on this route.
        example: 100
      max_replay:
        type: integer
        description: Maximum number of replay attempts before a message is sent to DLQ.
        example: 3
      ack_after:
        type: string
        description: >
          When to acknowledge the source message. `send` acknowledges after
          successful send; `receive` acknowledges on receive.
        enum: [send, receive]
        example: send
      on_expired:
        type: string
        description: Action when a message TTL expires (`dlq` or `drop`).
        enum: [dlq, drop]
        example: dlq
      on_perm_failure:
        type: string
        description: Action on permanent (non-retriable) failure (`dlq` or `drop`).
        enum: [dlq, drop]
        example: dlq

  HealthResponse:
    type: object
    required: [status]
    description: >
      Unauthenticated health probe response for load balancers. To avoid
      leaking operational detail to unauthenticated callers it carries ONLY
      the coarse status string -- never instance_id, route count, or
      component-failure detail (those live behind auth on /deephealth).
    properties:
      status:
        type: string
        description: >
          Health status. `ok` when running and healthy, `unhealthy` when
          components report errors, `not_running` when runtime exists but
          is stopped, `unavailable` when the runtime is not yet initialized.
        enum: [ok, unhealthy, not_running, unavailable]
        example: ok

  DLQSummary:
    type: object
    required: [configured, count, count_capped]
    description: Summary of dead-letter queue state.
    properties:
      configured:
        type: boolean
        description: Whether a DLQ store is configured.
        example: true
      count:
        type: integer
        description: >
          Number of messages scanned, up to a cap of 1000. When `count_capped`
          is true this is a lower bound, not the exact depth.
        example: 42
      count_capped:
        type: boolean
        description: >
          True when the 1000-entry scan cap was hit, so the real backlog is at
          least `count`. Alerting must treat a capped count as a lower bound.
        example: false

  DLQEntryView:
    type: object
    required: [id, route_id, subject, reason, category, failed_at, attempts]
    description: A single dead-letter queue entry.
    properties:
      id:
        type: string
        description: Unique DLQ entry identifier.
        example: dlq-001
      route_id:
        type: string
        description: Route that produced this DLQ entry.
        example: mqtt-to-sqs
      binding_id:
        type: string
        description: Binding within the route.
        example: bind-1
      session_id:
        type: string
        description: Transport session that produced this entry.
        example: sess-1
      source_id:
        type: string
        description: Source receiver identifier.
        example: src-1
      correlation_id:
        type: string
        description: Correlation ID from the original message.
        example: corr-abc
      subject:
        type: string
        description: Message subject (topic or queue name).
        example: sensors/temp
      reason:
        type: string
        description: Human-readable reason for DLQ placement.
        example: delivery timeout
      category:
        type: string
        description: Error category that caused DLQ placement.
        enum: [transient, permanent, expired, rejected]
        example: transient
      error_code:
        type: string
        description: Machine-readable error code.
        example: TIMEOUT
      last_error:
        type: string
        description: Last error message before DLQ placement.
        example: context deadline exceeded
      failed_at:
        type: string
        format: date-time
        description: Timestamp when the message was placed in the DLQ (RFC 3339).
        example: "2025-12-01T10:30:00Z"
      attempts:
        type: integer
        description: Number of delivery attempts before failure.
        example: 3

  DLQMessagesResponse:
    type: object
    required: [messages, limit, offset, has_more]
    description: Paginated list of DLQ messages.
    properties:
      messages:
        type: array
        description: DLQ entries matching the filter criteria (payload omitted).
        items:
          $ref: "#/schemas/DLQEntryView"
      limit:
        type: integer
        description: Effective limit used for this query.
        example: 100
      offset:
        type: integer
        description: Offset applied to this query.
        example: 0
      has_more:
        type: boolean
        description: >
          True when at least one more entry exists beyond this page (computed
          by over-fetching one entry). Replaces the former `total`, which
          under-reported once the backlog exceeded the page window.
        example: false

  InjectRequest:
    type: object
    required: [subject]
    description: >
      Request body for injecting a synthetic message into a route.
      The total body size is limited to 1 MB.
    properties:
      subject:
        type: string
        description: Message subject (topic, queue name, or routing key).
        example: sensors/temp
      payload:
        type: string
        format: byte
        description: >
          Base64-encoded message payload (standard encoding, RFC 4648).
          Omit or send empty string for an empty payload.
        example: eyJ0ZW1wIjoyMi41fQ==
      headers:
        type: object
        additionalProperties: true
        description: >
          Arbitrary key-value headers attached to the message. Keys matching
          `X-Bridge-*` are automatically stripped by the server.
        example: { "source": "api-inject" }

  DLQEntryDetailView:
    description: A single DLQ entry with base64-encoded envelope payload.
    allOf:
      - $ref: "#/schemas/DLQEntryView"
      - type: object
        required: [payload]
        properties:
          payload:
            type: string
            format: byte
            description: >
              Base64-encoded envelope payload (standard encoding, RFC 4648).
              Empty string when the original message had no payload.
            example: eyJ0ZW1wIjoyMi41fQ==

  DLQRedriveRequest:
    type: object
    required: [ids]
    description: >
      Request body for redriving specific DLQ messages. Each entry is
      claimed by deleting it from the DLQ FIRST, then re-injected into its
      original route — confined to the single binding that failed, so
      redriving one leg of a fan-out route does not duplicate deliveries to
      the healthy bindings. Claim-before-inject gives at-most-once semantics:
      if the process crashes between the delete and the inject the entry is
      dropped rather than delivered twice (a best-effort restore closes most
      of that window). Duplicate IDs are deduplicated automatically.
    properties:
      ids:
        type: array
        description: DLQ entry IDs to redrive.
        minItems: 1
        maxItems: 100
        items:
          type: string
        example: ["dlq-001", "dlq-002"]

  DLQRedriveResponse:
    type: object
    required: [redriven, failed]
    description: >
      Result of a DLQ redrive. Returned with HTTP 200 when every requested
      entry redrove, or HTTP 207 Multi-Status when any entry failed (inspect
      the `errors` array).
    properties:
      redriven:
        type: integer
        description: >
          Messages claimed (deleted from the DLQ) and successfully re-injected
          into their original route.
        example: 2
      failed:
        type: integer
        description: Messages that could not be redriven.
        example: 1
      errors:
        type: array
        description: Per-entry error details. Present only when failed > 0.
        items:
          $ref: "#/schemas/DLQRedriveError"

  DLQRedriveError:
    type: object
    required: [id, error]
    description: Error detail for a single failed redrive.
    properties:
      id:
        type: string
        example: dlq-003
      error:
        type: string
        example: entry not found

  DLQDeleteRequest:
    type: object
    required: [ids]
    description: Request body for deleting specific DLQ entries by ID.
    properties:
      ids:
        type: array
        description: DLQ entry IDs to delete.
        minItems: 1
        maxItems: 1000
        items:
          type: string
        example: ["dlq-001", "dlq-002"]

  DLQDeleteResponse:
    type: object
    required: [deleted]
    description: Result of a DLQ delete operation.
    properties:
      deleted:
        type: integer
        description: Number of entries deleted.
        example: 2

  DLQDeleteByFilterRequest:
    type: object
    description: >
      Delete DLQ entries by filter. When no filter fields are set,
      `confirm_delete_all` must be true as a safety guard.
    properties:
      route_id:
        type: string
        description: Filter by route ID.
        example: mqtt-to-sqs
      category:
        type: string
        description: Filter by error category.
        example: transient
      since:
        type: string
        format: date-time
        description: Only delete entries failed at or after this time (RFC 3339).
        example: "2025-12-01T00:00:00Z"
      before:
        type: string
        format: date-time
        description: Only delete entries failed before this time (RFC 3339).
        example: "2025-12-31T23:59:59Z"
      limit:
        type: integer
        description: Maximum number of entries to delete.
        example: 100
      confirm_delete_all:
        type: boolean
        description: Must be true when no filter fields are set.
        default: false

  DeepHealthResponse:
    type: object
    required: [running, healthy, instance_id, role, ready_for_traffic, empty, service_level, level, sessions, routes]
    description: >
      Comprehensive health report covering runtime state, session connectivity,
      and route status. Returned with 200 when ready or 503 when not ready.
    properties:
      running:
        type: boolean
        description: Whether the bridge runtime is running.
        example: true
      healthy:
        type: boolean
        description: Overall health assessment.
        example: true
      instance_id:
        type: string
        description: Unique identifier for this bridge instance.
        example: gobridge-1
      role:
        type: string
        description: Cluster role (e.g. standalone, leader, follower).
        example: standalone
      ready_for_traffic:
        type: boolean
        description: Whether this instance should receive traffic from a load balancer.
        example: true
      empty:
        type: boolean
        description: >
          Whether this instance carries no routes and no sessions, so no message
          can be bridged through it. True for a bridge started without a usable
          configuration. An empty instance is alive and running but never
          reaches the `full` readiness level and never claims
          `ready_for_traffic`.
        example: false
      service_level:
        type: string
        description: >
          Aggregated service level across all sessions. `full` when all
          sessions are fully healthy, `degraded` when some are impaired,
          `none` when no sessions are functional.
        enum: [full, degraded, none]
        example: full
      level:
        type: string
        description: Stable machine-readable readiness level derived from this health snapshot.
        enum: [down, live, running, connected, subscribed, full]
        example: full
      sessions:
        type: array
        description: Per-session health details.
        items:
          $ref: "#/schemas/DeepHealthSession"
      routes:
        type: array
        description: Configured routes with delivery mode.
        items:
          $ref: "#/schemas/DeepHealthRoute"
      config_watch:
        $ref: "#/schemas/ConfigWatchHealth"

  DeepHealthSession:
    type: object
    required:
      - session_id
      - connected
      - has_lease
      - subscriptions_wanted
      - subscriptions_active
      - ready
      - service_level
      - unsettled_count
      - oldest_unsettled_age_ms
      - receive_window_utilization
      - recovery_recycle_count
    description: Health status of a single transport session.
    properties:
      session_id:
        type: string
        description: Transport session identifier.
        example: mqtt-main
      connected:
        type: boolean
        description: Whether the underlying transport connection is active.
        example: true
      has_lease:
        type: boolean
        description: Whether the session holds a cluster lease (relevant for shared sessions).
        example: true
      subscriptions_wanted:
        type: integer
        description: Number of subscriptions the session should have.
        example: 5
      subscriptions_active:
        type: integer
        description: Number of subscriptions currently active.
        example: 5
      ready:
        type: boolean
        description: Whether the session is fully converged and ready.
        example: true
      service_level:
        type: string
        description: >
          Session service level. `full` when connected with all subscriptions
          active, `degraded` when partially converged, `none` when disconnected.
        enum: [full, degraded, none]
        example: full
      unsettled_count:
        type: integer
        minimum: 0
        description: Current-connection QoS 1/2 packets awaiting protocol settlement.
      oldest_unsettled_age_ms:
        type: integer
        format: int64
        minimum: 0
        description: Age in milliseconds of the oldest current-connection unsettled packet.
      receive_window_utilization:
        type: number
        format: double
        minimum: 0
        maximum: 1
        description: Fraction of the receive window occupied by unsettled packets.
      recovery_recycle_count:
        type: integer
        format: int64
        minimum: 0
        description: Recovery recycle attempts started after acquiring the session gate.

  DeepHealthRoute:
    type: object
    required: [id, delivery_mode, ready, in_flight, route_dead]
    description: Minimal route info included in deep health checks.
    properties:
      id:
        type: string
        description: Route identifier.
        example: mqtt-to-sqs
      delivery_mode:
        type: string
        description: Delivery strategy for this route.
        enum: [direct_hold, shared_outbox]
        example: direct_hold
      ready:
        type: boolean
        description: Whether the route can currently accept traffic.
      in_flight:
        type: integer
        minimum: 0
        description: Messages currently being processed by the route.
      route_dead:
        type: boolean
        description: Whether an unrecoverable route failure has stopped processing.

  ConfigWatchHealth:
    type: object
    required: [degraded, reconfigure_pending]
    description: Live configuration watcher and desired/running convergence health.
    properties:
      degraded:
        type: boolean
        description: Whether the watcher or live apply path requires operator attention.
      reason:
        type: string
        description: Human-readable degradation reason.
      reconfigure_pending:
        type: boolean
        description: Whether the durable desired version differs from the running version.
      desired_version:
        type: integer
        description: Latest durable configuration version accepted by the manager.
      running_version:
        type: integer
        description: Configuration version confirmed by the running bridge.
      last_apply_error:
        type: string
        description: Definitive live-apply error for the current desired config; cleared when that desired config succeeds or is superseded.
      restart_required:
        type: string
        description: >
          Names a part of the desired configuration that has been accepted and
          durably stored but cannot be applied to the running process, so the
          change stays inert until the process is restarted. The `http` block is
          the case that exists today: admin and monitor listeners are bound once,
          at startup. Absent when the running process matches its desired
          configuration in every such field.
        example: "http admin_addr changed since startup; HTTP listeners are bound once at startup, so restart the process to apply"
