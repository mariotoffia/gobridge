openapi: 3.1.0
info:
  title: GoBridge Management API
  version: 1.1.0
  description: >
    Admin and Monitor HTTP endpoints for managing a GoBridge instance.
    The admin server (default :8080) handles bridge lifecycle, route management,
    DLQ operations, and message injection. The monitor server (default :8081)
    provides health probes, cluster topology, and deep health checks.


    **Authentication** -- Admin endpoints require an API key (minimum 16
    characters) supplied via the `X-API-Key` header or as a `Bearer` token.
    Monitor sensitive endpoints accept the monitor API key or fall back to the
    admin key (admin is a superset). All key comparisons use SHA-256
    constant-time comparison.


    **Observability** -- Every response includes `X-Correlation-ID`,
    `X-Trace-ID`, and `X-Span-ID` headers injected by middleware.


    **CORS** -- When `cors_origins` is configured, browser preflight
    (OPTIONS) requests from an allowed origin receive
    `Access-Control-Allow-Methods: GET, POST, PATCH, DELETE, OPTIONS`.
    PATCH and DELETE are required for the config-transaction endpoints
    (apply overlay and rollback). Origins are matched exactly; the
    wildcard `*` is rejected at startup.
  contact:
    name: GoBridge Maintainers
  license:
    name: MIT
servers:
  - url: http://localhost:8080
    description: Admin server (bridge lifecycle, routes, DLQ, message injection)
  - url: http://localhost:8081
    description: Monitor server (health probes, topology, deep health)
tags:
  - name: Bridge
    description: Bridge lifecycle operations (start, stop, status)
  - name: Routes
    description: Route listing and message injection
  - name: DLQ
    description: Dead-letter queue summary, browsing, redrive, delete, and purge
  - name: Health
    description: Unauthenticated health, liveness, and readiness probes
  - name: Monitor
    description: Authenticated topology, route detail, and deep health
  - name: Config
    description: Configuration read/write with transactional batch support
security:
  - ApiKeyAuth: []
  - BearerAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      $ref: "components.yaml#/securitySchemes/ApiKeyAuth"
    BearerAuth:
      $ref: "components.yaml#/securitySchemes/BearerAuth"
  parameters:
    RouteID:
      $ref: "components.yaml#/parameters/RouteID"
  responses:
    Unauthorized:
      $ref: "components.yaml#/responses/Unauthorized"
    UnauthorizedMonitor:
      $ref: "components.yaml#/responses/UnauthorizedMonitor"
    NoDLQStore:
      $ref: "components.yaml#/responses/NoDLQStore"
    RuntimeUnavailable:
      $ref: "components.yaml#/responses/RuntimeUnavailable"
    BridgeStatusResponse:
      $ref: "components.yaml#/responses/BridgeStatusResponse"
  schemas:
    ErrorResponse:
      $ref: "components.yaml#/schemas/ErrorResponse"
    StatusMessage:
      $ref: "components.yaml#/schemas/StatusMessage"
    BridgeStatus:
      $ref: "components.yaml#/schemas/BridgeStatus"
    RouteView:
      $ref: "components.yaml#/schemas/RouteView"
    TopologyRouteView:
      $ref: "components.yaml#/schemas/TopologyRouteView"
    TopologyResponse:
      $ref: "components.yaml#/schemas/TopologyResponse"
    MonitorRouteView:
      $ref: "components.yaml#/schemas/MonitorRouteView"
    HealthResponse:
      $ref: "components.yaml#/schemas/HealthResponse"
    DLQSummary:
      $ref: "components.yaml#/schemas/DLQSummary"
    DLQEntryView:
      $ref: "components.yaml#/schemas/DLQEntryView"
    DLQMessagesResponse:
      $ref: "components.yaml#/schemas/DLQMessagesResponse"
    InjectRequest:
      $ref: "components.yaml#/schemas/InjectRequest"
    DLQEntryDetailView:
      $ref: "components.yaml#/schemas/DLQEntryDetailView"
    DLQRedriveRequest:
      $ref: "components.yaml#/schemas/DLQRedriveRequest"
    DLQRedriveResponse:
      $ref: "components.yaml#/schemas/DLQRedriveResponse"
    DLQRedriveError:
      $ref: "components.yaml#/schemas/DLQRedriveError"
    DLQDeleteRequest:
      $ref: "components.yaml#/schemas/DLQDeleteRequest"
    DLQDeleteResponse:
      $ref: "components.yaml#/schemas/DLQDeleteResponse"
    DLQDeleteByFilterRequest:
      $ref: "components.yaml#/schemas/DLQDeleteByFilterRequest"
    DeepHealthResponse:
      $ref: "components.yaml#/schemas/DeepHealthResponse"
    DeepHealthSession:
      $ref: "components.yaml#/schemas/DeepHealthSession"
    DeepHealthRoute:
      $ref: "components.yaml#/schemas/DeepHealthRoute"
    BridgeConfig:
      $ref: "config-components.yaml#/schemas/BridgeConfig"
    ConfigResponse:
      $ref: "config-components.yaml#/schemas/ConfigResponse"
    ConfigTxnCreateRequest:
      $ref: "config-components.yaml#/schemas/ConfigTxnCreateRequest"
    ConfigTxnCreateResponse:
      $ref: "config-components.yaml#/schemas/ConfigTxnCreateResponse"
    ConfigTxnStatusResponse:
      $ref: "config-components.yaml#/schemas/ConfigTxnStatusResponse"
    ConfigTxnPatchResponse:
      $ref: "config-components.yaml#/schemas/ConfigTxnPatchResponse"
    ConfigTxnCommitResponse:
      $ref: "config-components.yaml#/schemas/ConfigTxnCommitResponse"
    ConfigTxnRollbackResponse:
      $ref: "config-components.yaml#/schemas/ConfigTxnRollbackResponse"
    ConfigValidationError:
      $ref: "config-components.yaml#/schemas/ConfigValidationError"

paths:
  # ── Admin: Bridge ───────────────────────────────────────────────
  /api/v1/admin/bridge:
    get:
      operationId: getBridgeStatus
      summary: Get bridge status
      description: Returns the current bridge instance ID, running state, and route count.
      tags: [Bridge]
      responses:
        "200":
          $ref: "#/components/responses/BridgeStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"

  /api/v1/admin/bridge/start:
    post:
      operationId: startBridge
      summary: Start the bridge
      description: >
        Starts the bridge runtime with a 30-second server-side timeout.
        Returns 409 if the bridge cannot start.
      tags: [Bridge]
      responses:
        "200":
          description: Bridge started successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"
              example: { "status": "started" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Bridge could not be started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { "error": "bridge start failed" }
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"

  /api/v1/admin/bridge/stop:
    post:
      operationId: stopBridge
      summary: Stop the bridge
      description: >
        Gracefully stops the bridge runtime with a 30-second server-side
        timeout. Returns 500 if shutdown fails.
      tags: [Bridge]
      responses:
        "200":
          description: Bridge stopped successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"
              example: { "status": "stopped" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Bridge stop failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { "error": "bridge stop failed" }
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"

  # ── Admin: Routes ───────────────────────────────────────────────
  /api/v1/admin/routes:
    get:
      operationId: listAdminRoutes
      summary: List configured routes
      description: Returns all configured routes with basic policy information.
      tags: [Routes]
      responses:
        "200":
          description: Route list returned successfully.
          content:
            application/json:
              schema:
                type: object
                required: [routes]
                properties:
                  routes:
                    type: array
                    items:
                      $ref: "#/components/schemas/RouteView"
              example:
                routes:
                  - { id: mqtt-to-sqs, delivery_mode: direct_hold, dispatch_mode: parallel, max_in_flight: 100 }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"

  /api/v1/admin/routes/{routeID}/inject:
    post:
      operationId: injectMessage
      summary: Inject a message into a route
      description: >
        Injects a synthetic message into the specified route. Body limited to
        1 MB. Reserved `X-Bridge-*` headers are stripped automatically.
      tags: [Routes]
      parameters:
        - $ref: "#/components/parameters/RouteID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InjectRequest"
      responses:
        "200":
          description: Message injected successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"
              example: { "status": "injected" }
        "400":
          description: Invalid request (malformed JSON or bad base64 payload).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidBody:
                  summary: Malformed JSON
                  value: { "error": "invalid request body" }
                badBase64:
                  summary: Bad base64 payload
                  value: { "error": "payload must be base64-encoded" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Route not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { "error": "route not found" }
        "500":
          description: Injection failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { "error": "message injection failed" }
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"

  # ── Admin: DLQ ──────────────────────────────────────────────────
  /api/v1/admin/dlq:
    get:
      operationId: getDLQSummary
      summary: Get DLQ summary
      description: Returns whether a DLQ store is configured and the current entry count.
      tags: [DLQ]
      responses:
        "200":
          description: DLQ summary returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DLQSummary"
              example: { "configured": true, "count": 42 }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NoDLQStore"
        "500":
          description: Failed to query DLQ store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { "error": "failed to list DLQ entries" }
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"

  /api/v1/admin/dlq/messages:
    get:
      operationId: listDLQMessages
      summary: List DLQ messages
      description: >
        Returns paginated DLQ messages with optional filtering by route,
        category, and time range.
      tags: [DLQ]
      parameters:
        - name: limit
          in: query
          description: Maximum number of messages to return (clamped to 1000).
          schema: { type: integer, default: 100, minimum: 1, maximum: 1000 }
        - name: offset
          in: query
          description: Number of messages to skip for pagination.
          schema: { type: integer, default: 0, minimum: 0 }
        - name: route_id
          in: query
          description: Filter messages by route ID.
          schema: { type: string }
          example: mqtt-to-sqs
        - name: category
          in: query
          description: Filter by error category (transient, permanent, expired, rejected).
          schema: { type: string }
          example: transient
        - name: since
          in: query
          description: Only return messages that failed at or after this time (RFC 3339).
          schema: { type: string, format: date-time }
          example: "2025-12-01T00:00:00Z"
        - name: before
          in: query
          description: Only return messages that failed before this time (RFC 3339).
          schema: { type: string, format: date-time }
          example: "2025-12-31T23:59:59Z"
      responses:
        "200":
          description: Paginated DLQ message list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DLQMessagesResponse"
        "400":
          description: Invalid query parameter format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badLimit:
                  value: { "error": "limit must be a positive integer" }
                badOffset:
                  value: { "error": "offset must be a non-negative integer" }
                badSince:
                  value: { "error": "since must be RFC3339 format" }
                badBefore:
                  value: { "error": "before must be RFC3339 format" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NoDLQStore"
        "500":
          description: Failed to list DLQ messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { "error": "failed to list DLQ messages" }
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"

  /api/v1/admin/dlq/messages/{id}:
    get:
      operationId: getDLQMessageByID
      summary: Get a single DLQ entry
      description: >
        Returns a single DLQ entry by ID, including the base64-encoded
        envelope payload. Returns 404 if the entry does not exist.
      tags: [DLQ]
      parameters:
        - $ref: "components.yaml#/parameters/DLQMessageID"
      responses:
        "200":
          description: DLQ entry returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DLQEntryDetailView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: DLQ entry not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { "error": "DLQ entry not found" }
        "500":
          description: Failed to get DLQ entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { "error": "failed to get DLQ entry" }
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"

  /api/v1/admin/dlq/redrive:
    post:
      operationId: redriveDLQMessages
      summary: Redrive DLQ messages
      description: >
        Re-injects specific DLQ messages by ID into their original routes.
        Successfully redriven entries are automatically deleted from the
        DLQ store. Duplicate IDs in the request are deduplicated. Body
        limited to 1 MB. Maximum 100 IDs per call.


        Partial success is possible — the response includes per-entry
        error details for any entries that could not be redriven (e.g.
        entry not found, route not found).
      tags: [DLQ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DLQRedriveRequest"
      responses:
        "200":
          description: >
            Redrive operation completed. Check `redriven` and `failed`
            counts to determine if all entries were processed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DLQRedriveResponse"
              examples:
                allSuccess:
                  summary: All entries redriven
                  value: { "redriven": 2, "failed": 0 }
                partialFailure:
                  summary: Some entries failed
                  value:
                    redriven: 1
                    failed: 1
                    errors:
                      - { id: "dlq-002", error: "entry not found" }
                withWarning:
                  summary: Redriven but cleanup failed
                  value:
                    redriven: 2
                    failed: 0
                    warning: "failed to delete redriven entries"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidBody:
                  value: { "error": "invalid request body" }
                emptyIDs:
                  value: { "error": "ids must not be empty" }
                tooManyIDs:
                  value: { "error": "ids exceeds maximum of 100" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NoDLQStore"
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"

  /api/v1/admin/dlq/delete:
    post:
      operationId: deleteDLQByIDs
      summary: Delete DLQ entries by ID
      description: >
        Deletes specific DLQ entries by their IDs. Body limited to 1 MB.
        Maximum 1000 IDs per call.
      tags: [DLQ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DLQDeleteRequest"
      responses:
        "200":
          description: Entries deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DLQDeleteResponse"
              example: { "deleted": 2 }
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidBody:
                  value: { "error": "invalid request body" }
                emptyIDs:
                  value: { "error": "ids must not be empty" }
                tooManyIDs:
                  value: { "error": "ids exceeds maximum of 1000" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NoDLQStore"
        "500":
          description: Delete failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { "error": "DLQ delete failed" }
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"

  /api/v1/admin/dlq/delete-by-filter:
    post:
      operationId: deleteDLQByFilter
      summary: Delete DLQ entries by filter
      description: >
        Deletes DLQ entries matching the specified filter criteria. When
        no filter fields are provided, `confirm_delete_all` must be set
        to true as a safety guard against accidental mass deletion. Body
        limited to 1 MB.
      tags: [DLQ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DLQDeleteByFilterRequest"
      responses:
        "200":
          description: Matching entries deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DLQDeleteResponse"
              example: { "deleted": 42 }
        "400":
          description: Invalid request body or missing confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidBody:
                  value: { "error": "invalid request body" }
                badSince:
                  value: { "error": "since must be RFC3339 format" }
                badBefore:
                  value: { "error": "before must be RFC3339 format" }
                noConfirm:
                  value: { "error": "empty filter would delete all entries; set confirm_delete_all=true to proceed" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NoDLQStore"
        "500":
          description: Delete by filter failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { "error": "DLQ delete by filter failed" }
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"

  /api/v1/admin/dlq/purge:
    post:
      operationId: purgeDLQ
      summary: Purge all DLQ entries
      description: Removes all messages from the DLQ store. No request body required.
      tags: [DLQ]
      responses:
        "200":
          description: DLQ purged successfully.
          content:
            application/json:
              schema:
                type: object
                required: [purged]
                properties:
                  purged:
                    type: integer
                    description: Number of messages purged.
              example: { "purged": 42 }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NoDLQStore"
        "500":
          description: Purge failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { "error": "DLQ purge failed" }
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"

  # ── Monitor: Unauthenticated probes ─────────────────────────────
  /api/v1/monitor/health:
    get:
      operationId: getHealth
      summary: Health check
      description: >
        Composite health probe for load balancers. Returns 200 when healthy,
        503 when unhealthy or not running. Always sets
        `Cache-Control: no-cache, max-age=0`.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Bridge is running and healthy.
          headers:
            Cache-Control:
              schema: { type: string, example: "no-cache, max-age=0" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                healthy:
                  value: { "status": "ok", "instance_id": "gobridge-1", "routes": 3 }
                degraded:
                  value: { "status": "ok", "instance_id": "gobridge-1", "routes": 3, "failed_components": 1 }
        "503":
          description: Bridge is unhealthy, not running, or runtime unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                unhealthy:
                  value: { "status": "unhealthy", "instance_id": "gobridge-1", "routes": 3 }
                notRunning:
                  value: { "status": "not_running", "instance_id": "gobridge-1", "routes": 0 }
                unavailable:
                  value: { "status": "unavailable", "instance_id": "", "routes": 0 }

  /api/v1/monitor/live:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: >
        Always returns 200 if the process is alive. Suitable for Kubernetes
        liveness probes. Sets `Cache-Control: no-cache, max-age=0`.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Process is alive.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"
              example: { "status": "alive" }

  /api/v1/monitor/ready:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: >
        Returns 200 when running and healthy, 503 otherwise. Suitable for
        Kubernetes readiness probes. Sets `Cache-Control: no-cache, max-age=0`.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Bridge is ready for traffic.
          content:
            application/json:
              schema:
                type: object
                required: [status, role]
                properties:
                  status:
                    type: string
                    example: ready
                  role:
                    type: string
                    description: Cluster role (e.g. standalone, leader, follower).
                    example: standalone
        "503":
          description: Bridge is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { "error": "not ready" }

  # ── Monitor: Authenticated endpoints ────────────────────────────
  /api/v1/monitor/topology:
    get:
      operationId: getTopology
      summary: Get cluster topology
      description: >
        Returns instance identity, running state, and a compact route list.
        When a config provider is wired, the response also carries
        `config_version` -- the running configuration version -- for
        scrapeable fleet-convergence monitoring. Requires monitor or admin
        authentication.
      tags: [Monitor]
      responses:
        "200":
          description: Topology returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedMonitor"
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"

  /api/v1/monitor/routes:
    get:
      operationId: listMonitorRoutes
      summary: List routes with full policy detail
      description: >
        Returns all routes with detailed policy fields including replay
        limits, ack strategy, and failure handling.
      tags: [Monitor]
      responses:
        "200":
          description: Detailed route list returned.
          content:
            application/json:
              schema:
                type: object
                required: [routes]
                properties:
                  routes:
                    type: array
                    items:
                      $ref: "#/components/schemas/MonitorRouteView"
              example:
                routes:
                  - id: mqtt-to-sqs
                    delivery_mode: direct_hold
                    dispatch_mode: parallel
                    max_in_flight: 100
                    max_replay: 3
                    ack_after: send
                    on_expired: dlq
                    on_perm_failure: dlq
        "401":
          $ref: "#/components/responses/UnauthorizedMonitor"
        "503":
          $ref: "#/components/responses/RuntimeUnavailable"

  /api/v1/monitor/deephealth:
    get:
      operationId: getDeepHealth
      summary: Deep health check
      description: >
        Comprehensive health check covering session connectivity, lease
        status, subscription convergence, and route state. Returns 503
        when not ready for traffic.
      tags: [Monitor]
      responses:
        "200":
          description: Instance is ready for traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealthResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedMonitor"
        "503":
          description: Instance is not ready (same schema, ready_for_traffic=false).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealthResponse"

  # ── Admin: Config ──────────────────────────────────────────────
  /api/v1/admin/config:
    get:
      operationId: getConfig
      summary: Get current effective config
      description: >
        Returns the current merged configuration with sensitive fields
        (API keys) redacted as "***". Enabled only when the server is
        configured with a config file path and config provider.
      tags: [Config]
      responses:
        "200":
          description: Current config returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: No config available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/config/transactions:
    post:
      operationId: createConfigTransaction
      summary: Begin a config transaction
      description: >
        Creates a new config transaction. Only one transaction may be
        active at a time; returns 409 if another exists. The transaction
        auto-rolls back after the specified TTL (default 5 minutes,
        max 30 minutes). An empty request body creates a transaction with
        the default TTL; a non-empty malformed body is rejected with 400.
      tags: [Config]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigTxnCreateRequest"
      responses:
        "201":
          description: Transaction created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigTxnCreateResponse"
        "400":
          description: >
            Invalid request body. Returned when the body is non-empty but
            not valid JSON, or when the "ttl" field is not a valid Go
            duration string. An empty body is accepted and uses defaults.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { "error": "invalid request body" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Another transaction is already active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { "error": "another config transaction is already active" }

  /api/v1/admin/config/transactions/{txnID}:
    parameters:
      - $ref: "config-components.yaml#/parameters/TxnID"
    get:
      operationId: getConfigTransaction
      summary: Get transaction state and preview
      description: >
        Returns the active transaction's metadata (ID, timestamps, patch
        count) and the current merged preview with all patches applied.
      tags: [Config]
      responses:
        "200":
          description: Transaction state and preview returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigTxnStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "config-components.yaml#/responses/TxnNotFound"
    patch:
      operationId: patchConfigTransaction
      summary: Apply config overlay to transaction
      description: >
        Merges a partial BridgeConfig overlay on top of the current
        effective config plus all previous patches. Validates the merged
        result and returns a preview. Returns 422 if the merged config
        is invalid. Invalid patches are rejected without modifying the
        transaction state.
      tags: [Config]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BridgeConfig"
      responses:
        "200":
          description: Patch applied, merged preview returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigTxnPatchResponse"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "config-components.yaml#/responses/TxnNotFound"
        "422":
          $ref: "config-components.yaml#/responses/ConfigValidationFailed"
    delete:
      operationId: rollbackConfigTransaction
      summary: Rollback (discard) a transaction
      description: >
        Discards the active transaction and all accumulated patches.
        After rollback, a new transaction may be created.
      tags: [Config]
      responses:
        "200":
          description: Transaction rolled back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigTxnRollbackResponse"
              example: { "status": "rolled_back" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "config-components.yaml#/responses/TxnNotFound"

  /api/v1/admin/config/transactions/{txnID}/commit:
    parameters:
      - $ref: "config-components.yaml#/parameters/TxnID"
    post:
      operationId: commitConfigTransaction
      summary: Commit config to disk
      description: >
        Validates the final merged config, performs a check-and-set
        version comparison against the on-disk config, increments the
        version, and writes the file (temp file + rename). The file
        watcher detects the change and the supervisor applies the new
        config through its normal reconfiguration pipeline.


        Returns 409 if the on-disk config version has changed since
        the transaction was created (another instance committed first).
        The client must re-read the config, create a new transaction,
        re-apply patches, and retry.


        Returns 422 if validation fails, 500 if the disk write fails.


        **Multi-instance note:** the version check provides
        optimistic concurrency control suitable for infrequent config
        changes across EFS-backed clusters. It is not perfectly atomic
        on network filesystems. For high-frequency concurrent config
        management, use the DynamoDB-backed config profile instead.
      tags: [Config]
      responses:
        "200":
          description: Config committed to disk. The config version has been incremented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigTxnCommitResponse"
              example: { "status": "committed" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "config-components.yaml#/responses/TxnNotFound"
        "409":
          description: >
            Config version conflict. Another instance committed a
            config change after this transaction was created. The
            client must re-read the current config, create a new
            transaction, re-apply desired patches, and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { "error": "config version conflict: expected version 2 but file has version 3; re-read the config and retry" }
        "422":
          $ref: "config-components.yaml#/responses/ConfigValidationFailed"
        "500":
          description: Failed to write config to disk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { "error": "config operation failed" }
