parameters:
  TxnID:
    name: txnID
    in: path
    required: true
    description: Unique identifier of the config transaction.
    schema:
      type: string
    example: a1b2c3d4e5f67890

responses:
  TxnNotFound:
    description: Transaction not found or expired.
    content:
      application/json:
        schema:
          $ref: "#/schemas/ErrorResponse"
        example: { "error": "transaction not found or expired" }

  ConfigValidationFailed:
    description: Merged config fails validation.
    content:
      application/json:
        schema:
          $ref: "#/schemas/ConfigValidationError"
        example:
          error: "config validation failed"
          validation_errors:
            - "receivers[0].id 'nonexistent' is referenced by routes[1] but not defined"
          warnings: []

schemas:
  ErrorResponse:
    type: object
    required: [error]
    properties:
      error:
        type: string
        description: Human-readable error message.

  ConfigResponse:
    type: object
    required: [config]
    properties:
      config:
        $ref: "#/schemas/BridgeConfig"
    description: Current effective config with sensitive fields redacted.

  ConfigTxnCreateRequest:
    type: object
    properties:
      ttl:
        type: string
        description: >
          How long the transaction remains active before auto-rollback.
          Go duration format (e.g. "5m", "10m30s"). Default: 5m, max: 30m.
        example: "5m"

  ConfigTxnCreateResponse:
    type: object
    required: [txn_id, created_at, expires_at, config]
    properties:
      txn_id:
        type: string
        description: Unique transaction identifier.
        example: a1b2c3d4e5f67890
      created_at:
        type: string
        format: date-time
      expires_at:
        type: string
        format: date-time
      config:
        $ref: "#/schemas/BridgeConfig"

  ConfigTxnStatusResponse:
    type: object
    required: [txn_id, created_at, expires_at, patch_count, preview]
    properties:
      txn_id:
        type: string
        example: a1b2c3d4e5f67890
      created_at:
        type: string
        format: date-time
      expires_at:
        type: string
        format: date-time
      patch_count:
        type: integer
        description: Number of patches applied so far.
      preview:
        $ref: "#/schemas/BridgeConfig"

  ConfigTxnPatchResponse:
    type: object
    required: [txn_id, preview]
    properties:
      txn_id:
        type: string
      preview:
        $ref: "#/schemas/BridgeConfig"
      warnings:
        type: array
        items:
          type: string
        description: Non-fatal validation warnings (advisory).

  ConfigTxnCommitResponse:
    type: object
    required: [status, version]
    properties:
      status:
        type: string
        enum: [committed, committed_applying]
      version:
        type: integer
        description: The new config version after the commit.
        example: 4
      error:
        type: string
        description: >
          Convergence detail when status is committed_applying. The durable
          desired config is retained and no compensating rollback is required.

  ConfigTxnRollbackResponse:
    type: object
    required: [status]
    properties:
      status:
        type: string
        enum: [rolled_back]

  ConfigValidationError:
    type: object
    required: [error, validation_errors]
    properties:
      error:
        type: string
        example: "config validation failed"
      validation_errors:
        type: array
        items:
          type: string
        description: List of fatal validation errors.
      warnings:
        type: array
        items:
          type: string
        description: Non-fatal validation warnings.

  BridgeConfig:
    type: object
    description: >
      Full GoBridge configuration. When returned in API responses, sensitive
      fields (API keys) are redacted as "[REDACTED]". When sent as a PATCH
      overlay, only the fields present are merged; absent fields are left
      unchanged.


      PATCH is merge-only: omitted, empty-string, empty-list, and the redaction
      marker "[REDACTED]" (the value echoed back by a redacted read) all
      preserve the current value. A field cannot be cleared or removed via
      PATCH — to clear a field, submit a full replacement configuration. Fields
      that cannot be cleared this way include http.cors_origins,
      http.tls_cert_file / http.tls_key_file, http.admin_api_key /
      http.monitor_api_key (empty or "[REDACTED]" keeps the stored secret; any
      other non-empty string overwrites the secret verbatim), a
      receiver/sender/binding session_id, and a receiver's topics list.


      An overlay that includes a `bridge` block repeats `bridge.id`, which
      the block requires.


      The `version` field is an optimistic-concurrency counter. It is
      incremented on each successful config commit via the transaction API.
      When multiple instances share a config file (e.g. on AWS EFS), the
      commit uses check-and-set: it succeeds only when the on-disk version
      matches the version the transaction was started against. A version
      conflict returns HTTP 409 and the client must re-read and retry.


      **Note:** the check-and-set is not perfectly atomic on network
      filesystems (NFS/EFS). For truly concurrent config management across
      many writers, use the DynamoDB-backed config profile instead.
    properties:
      version:
        type: integer
        description: >
          Optimistic-concurrency version counter. Incremented on each
          successful commit via the config transaction API. Zero means the
          config has never been committed via the API.
        example: 3
      bridge:
        $ref: "#/schemas/BridgeSettings"
      config_watch:
        $ref: "#/schemas/ConfigWatchDef"
      stores:
        $ref: "#/schemas/StoresConfig"
      sessions:
        type: array
        items:
          $ref: "#/schemas/SessionDef"
      receivers:
        type: array
        items:
          $ref: "#/schemas/ReceiverDef"
      senders:
        type: array
        items:
          $ref: "#/schemas/SenderDef"
      bindings:
        type: array
        items:
          $ref: "#/schemas/BindingDef"
      routes:
        type: array
        items:
          $ref: "#/schemas/RouteDef"
      http:
        $ref: "#/schemas/HTTPConfig"

  BridgeSettings:
    type: object
    required: [id]
    properties:
      id:
        type: string
        description: Unique bridge identifier.
      instance_id:
        type: string
      deployment_mode:
        type: string
        enum: [standalone, clustered]
      shutdown_timeout:
        type: string
        description: Go duration string (e.g. "30s").
      drain_timeout:
        type: string
      per_record_drain_timeout:
        type: string
        description: >
          Go duration string (e.g. "3s"). Per-record allowance in the outbox
          drain batch ceiling min(batchCount × per_record_drain_timeout,
          max_drain_timeout). Omitting the field takes the 3s default; the
          value must be positive.
        example: 3s
      max_drain_timeout:
        type: string
        description: >
          Go duration string (e.g. "10s"). Upper bound of the outbox drain
          batch ceiling. Omitting the field takes the 10s default; the value
          must be positive and at least per_record_drain_timeout.
        example: 10s
      log_level:
        type: string
        description: >
          Case-insensitive; "warning" is an accepted alias of "warn".
        enum: [debug, info, warn, warning, error]
      cluster:
        $ref: "#/schemas/ClusterConfig"

  ClusterConfig:
    type: object
    properties:
      endpoints:
        type: object
        additionalProperties:
          type: string
        description: >
          THIS instance's advertised capability endpoints, keyed by capability
          name — currently `http`, whose value is a full URL
          (scheme://host:port). An optional static override of auto-discovery,
          not a peer roster. In a clustered deployment a non-empty map must
          have an `http` key holding an absolute http or https URL.
        example: { "http": "http://10.0.1.10:8080" }
      members:
        type: array
        items:
          type: string
        description: >
          Static roster of member ids for a coordinated rollout. Must be
          identical on every member, with non-empty ids and no duplicates.
          Required non-empty when rollout is coordinated; ignored otherwise.
      rollout:
        type: string
        enum: [refuse, independent, coordinated]
        description: >
          Live config change strategy. Omitted or refuse: a clustered node
          rejects every live config delta and needs whole-cohort replacement.
          independent: each member applies a live-safe delta on its own.
          coordinated: the rollout barrier, which needs a shared rollout store,
          a lease-elected coordinator and members. independent and coordinated
          need a clustered deployment. See
          docs/cluster/spec/cluster-config-rollout-protocol.md.
      confirm_window:
        type: string
        description: >
          Go duration string (e.g. "90s"). Only valid with rollout coordinated.
          A positive value makes each commit provisional: if the cohort does
          not confirm in time, every member reverts to the last confirmed
          generation. Omitted or "0s" means a commit is final. See
          docs/adr/0014-confirm-window-provisional-commit.md.
        example: 90s

  ConfigWatchDef:
    type: object
    properties:
      mode:
        type: string
        enum: [notify, poll]
      poll_interval:
        type: string
      debounce:
        type: string

  StoresConfig:
    type: object
    properties:
      lease:
        $ref: "#/schemas/StoreConfig"
      outbox:
        $ref: "#/schemas/StoreConfig"
      dlq:
        $ref: "#/schemas/StoreConfig"
      managed_subscriptions:
        $ref: "#/schemas/StoreConfig"
        description: Exact durable MQTT topic-filter history.

  StoreConfig:
    type: object
    required: [type]
    properties:
      type:
        type: string
        example: dynamodb
      auto_redrive_window:
        type: string
        description: >
          stores.dlq only. Go duration string (e.g. "24h"). A dead-letter
          record younger than this may be redriven by a matching system event
          by itself; see docs/adr/0019-dlq-auto-redrive-by-system-event.md.
          Omitting the field takes the 24h default; "0s" turns automatic
          redrive off. Negative or malformed values, and the field on any other
          store role, are rejected.
        example: 24h
      options:
        type: object
        additionalProperties: true

  SessionDef:
    type: object
    required: [id, transport]
    properties:
      id:
        type: string
      transport:
        type: string
      session_mode:
        type: string
        enum: [ephemeral, persistent, exclusive]
      options:
        type: object
        additionalProperties: true

  ReceiverDef:
    type: object
    required: [id, transport]
    properties:
      id:
        type: string
      transport:
        type: string
      session_id:
        type: string
      topics:
        type: array
        items:
          $ref: "#/schemas/SubscriptionDef"
      options:
        type: object
        additionalProperties: true

  SubscriptionDef:
    type: object
    required: [topic]
    properties:
      topic:
        type: string
      qos:
        type: integer
      options:
        type: object
        additionalProperties: true

  SenderDef:
    type: object
    required: [id, transport]
    properties:
      id:
        type: string
      transport:
        type: string
      session_id:
        type: string
      options:
        type: object
        additionalProperties: true

  BindingDef:
    type: object
    required: [id, sender_id, address]
    properties:
      id:
        type: string
      sender_id:
        type: string
      session_id:
        type: string
      address:
        type: string
      options:
        type: object
        additionalProperties: true

  RouteDef:
    type: object
    required: [id, receiver_id]
    properties:
      id:
        type: string
      receiver_id:
        type: string
      delivery_mode:
        type: string
        enum: [direct_hold, shared_outbox]
      dispatch_mode:
        type: string
        enum: [single, fan_out]
      trust_bridge_headers:
        type: boolean
        description: >
          Keeps the bridge-to-bridge propagated x-bridge.* headers
          (correlation-id, causation-id, idempotency-key, dedup-id,
          ordering-key, tenant-id, forwarded-from/hop) instead of stripping
          every x-bridge.* header at ingress. Enable only for a receiver fed
          exclusively by a trusted upstream bridge. Internal-only headers are
          stripped regardless. Default false.
      policy:
        $ref: "#/schemas/PolicyDef"
      bindings:
        type: array
        items:
          type: string
      processors:
        type: array
        items:
          type: string
      resolver:
        $ref: "#/schemas/ResolverDef"
      session:
        $ref: "#/schemas/RouteSessionDef"

  ResolverDef:
    type: object
    required: [type]
    properties:
      type:
        type: string
        enum: [rules, header_map, all, static]
      default_binding:
        type: string
        description: >
          Fallback binding when no rule matches. Must be in the route's
          bindings.
      header_key:
        type: string
        description: Header whose value selects the binding. Required for header_map.
      header_map:
        type: object
        additionalProperties:
          type: string
        description: >
          Header value → binding id. header_map needs at least one entry, and
          every value must be in the route's bindings.
      rules:
        type: array
        items:
          $ref: "#/schemas/RuleDef"
        description: >
          Used by type rules, which needs at least one rule or a
          default_binding.

  RuleDef:
    type: object
    required: [binding_id]
    properties:
      binding_id:
        type: string
        description: Binding the rule selects. Must be in the route's bindings.
      match:
        type: array
        items:
          $ref: "#/schemas/ConditionDef"
        description: >
          Conditions that must all match. An empty list is a catch-all.

  ConditionDef:
    type: object
    required: [field, operator]
    properties:
      field:
        type: string
        description: >
          `subject`, `header.<key>`, `$.<json.path>`, or a bare name read as a
          header.
        example: header.region
      operator:
        type: string
        enum: [eq, ne, prefix, contains, regex, gt, lt, gte, lte, exists, in]
      value:
        description: >
          Any JSON value. A scalar for eq, ne, prefix and contains; a string
          regex pattern of at most 4096 characters for regex; a number for gt,
          lt, gte and lte; a list for in. For exists it is ignored unless it is
          an explicit boolean, and false means "must not exist".

  RouteSessionDef:
    type: object
    required: [session_id, sender_id]
    properties:
      session_id:
        type: string
        description: Must name a sessions[] entry.
      sender_id:
        type: string
        description: Must name a senders[] entry.
      lease_ttl:
        type: string
        description: >
          Go duration string (e.g. "360s"). How long the lease is valid.
          Omitting the field takes the 360s default, or a 45s HA baseline when
          the deployment is clustered and neither lease_ttl nor renew_interval
          is set.
        example: 360s
      renew_interval:
        type: string
        description: >
          Go duration string (e.g. "120s"). Omitted, it is derived from
          lease_ttl and max_renew_fails. When set, (renew_interval +
          lease_renew_jitter/2 + renew_call_timeout) × max_renew_fails must
          stay below lease_ttl.
      lease_renew_jitter:
        type: string
        description: >
          Go duration string (e.g. "2s"). Bounded random jitter on each renewal
          timer. Omitted, it is renew_interval/4.
      max_renew_fails:
        type: integer
        minimum: 0
        description: >
          Consecutive renewal failures before step-down. Default 3.
      step_down_grace:
        type: string
        description: >
          Go duration string (e.g. "15s"). How long to wait for in-flight work
          before releasing the lease. Default 15s.
      acquire_poll_interval:
        type: string
        description: >
          Go duration string (e.g. "5s"). How often a standby retries
          acquiring the lease. Omitted, it is min(renew_interval, lease_ttl/4,
          5s); the resolved value must be at least 250ms.
      renew_call_timeout:
        type: string
        description: >
          Go duration string (e.g. "3s"). Bounds one lease-renew store call.
          Omitted, it is min(renew_interval/2, 5s), and at least 1s.
      failover_slo:
        type: string
        description: >
          Go duration string. Optional failure-detection-to-full-service
          objective the preflight checks. Must be positive, and needs
          broker_health_step_down declared.
      startup_allowance:
        type: string
        description: >
          Go duration string. Bounded process-side startup time the failover
          budget reserves. Default 0; must be non-negative and at most 10m.
      broker_health_step_down:
        type: string
        description: >
          A positive Go duration string (e.g. "90s") or "off". Omitted means
          undecided, which is refused when failover_slo is set. A duration
          makes an active owner whose broker path stays unconverged that long
          release the lease.
        example: 90s
      drain_interval:
        type: string
        description: >
          Go duration string (e.g. "1s"). Fixed-poll outbox drain interval.
          Default 1s. Mutually exclusive with drain_strategy.
      drain_batch_size:
        type: integer
        description: Default 100.
      drain_max_batch_size:
        type: integer
        description: Default 500.
      drain_max_concurrency:
        type: integer
        description: Default 10.
      drain_strategy:
        $ref: "#/schemas/DrainStrategyDef"
      connect_after_lease:
        type: boolean
        description: >
          Defers the source session's broker connect until this instance holds
          the lease. Default true; set false only to opt out.

  DrainStrategyDef:
    type: object
    required: [type]
    properties:
      type:
        type: string
        enum: [fixed_poll, adaptive_backoff]
      interval:
        type: string
        description: >
          Go duration string (e.g. "1s"). fixed_poll only. Default 1s; must be
          positive.
      min_interval:
        type: string
        description: >
          Go duration string (e.g. "100ms"). adaptive_backoff only. Default
          100ms.
      max_interval:
        type: string
        description: >
          Go duration string (e.g. "30s"). adaptive_backoff only. Default 30s;
          must be at least min_interval.
      multiplier:
        type: number
        exclusiveMinimum: 1
        description: adaptive_backoff only. Default 2.

  PolicyDef:
    type: object
    properties:
      max_in_flight:
        type: integer
      ack_after:
        type: string
        enum: [target_accept, outbox_persist]
      max_replay_attempts:
        type: integer
      replay_budget:
        type: string
        description: >
          Go duration string (e.g. "15m"). shared_outbox routes only: the
          wall-clock ceiling, measured from a record's first attempt, on how
          long the outbox drainer keeps redelivering it. A record is poisoned
          to the DLQ only once both this budget and max_replay_attempts are
          spent. Omitting the field or "0s" takes the 15m default. Negative is
          rejected.
      send_retry_budget:
        type: string
        description: >
          Go duration string (e.g. "60s"). direct_hold routes only: how long a
          recoverable send failure is retried inside the bridge while the
          source message is still held. Omitting the field takes the 60s
          default; "0s" turns in-process send retry off. Negative is rejected.
      max_outbox_depth:
        type: integer
      on_expired:
        type: string
        enum: [drop, dlq]
      on_permanent_failure:
        type: string
        enum: [drop, dlq]
      on_filtered:
        type: string
        enum: [drop, dlq]
        description: >
          What happens to a message a processor intentionally filters out.
          Defaults to drop (dropped with a metric); dlq writes it to the DLQ and
          needs a DLQ store.
      backoff:
        $ref: "#/schemas/BackoffDef"
      send_timeout:
        type: string
        description: >
          Go duration string (e.g. "30s"). Timeout for an individual send
          operation. Omitting the field takes the 30s default; zero or negative
          is rejected.
      depth_cache_ttl:
        type: string
        description: >
          Go duration string (e.g. "1s"). How long outbox depth counts are
          cached for backpressure checks. Omitting the field takes the 1s
          default; zero or negative is rejected.
      allow_unfenced:
        type: boolean
        description: >
          Allows a direct_hold route over a shared-consumer source, which the
          bridge otherwise refuses to build. It only waives that check; no
          fencing is provided. Default false.
      allow_retry_drop:
        type: boolean
        description: >
          Accepts that a failed message is dropped when the source cannot
          retry or redeliver and no DLQ store is configured; without it the
          bridge refuses to build such a route. Default false.

  BackoffDef:
    type: object
    properties:
      initial_interval:
        type: string
      max_interval:
        type: string
      multiplier:
        type: number
        minimum: 1
        description: >
          Exponential backoff multiplier. Below 1 the delay shrinks on every
          attempt, so retries accelerate instead of backing off; 1 is a fixed
          retry interval.
      jitter:
        type: number
        minimum: 0
        maximum: 1
        description: >
          Equal-jitter fraction in [0,1] applied to each computed backoff
          delay to de-correlate retries across replicas. Omitting the field
          takes the recommended 0.2 default; an explicit 0 opts out and keeps
          the deterministic exponential delay.

  HTTPConfig:
    type: object
    description: >
      HTTP server configuration. API keys are redacted as "[REDACTED]" in responses.
    properties:
      admin_addr:
        type: string
        example: ":8080"
      monitor_addr:
        type: string
        example: ":8081"
      admin_api_key:
        type: string
        description: >
          Redacted in responses. The admin server refuses to start without an
          admin key of at least 16 characters, but the key need not be in the
          config: the gobridge binary takes a non-empty GOBRIDGE_ADMIN_API_KEY
          environment variable over this field, so it is not a required
          property.
      monitor_api_key:
        type: string
        description: Redacted in responses.
      cors_origins:
        type: string
      tls_cert_file:
        type: string
        description: >
          Path to the PEM server certificate, with any intermediate chain. Set
          both tls_cert_file and tls_key_file to serve HTTPS on the admin and
          monitor listeners, or neither to stay plaintext; one alone is
          rejected at startup. A change needs a restart to apply.
      tls_key_file:
        type: string
        description: >
          Path to the private key of tls_cert_file. Set together with
          tls_cert_file; a change needs a restart to apply.
