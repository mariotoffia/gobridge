name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  # Nightly schedule paused on request. Re-enable by uncommenting; GitHub only
  # honours `schedule:` from the default branch, so this must be changed on
  # main to take effect. The full suite still runs on every push and PR, and
  # can be triggered on demand via workflow_dispatch.
  # schedule:
  #   - cron: '17 2 * * *'

jobs:
  release-preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'

      # Source-safe before the first public module train: validates the
      # canonical DAG and tests the strict verifier while reporting (not
      # concealing) the known go.mod migration inventory.
      - name: Verify release manifest and preparation tooling
        run: make verify-release-preparation

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'

      - name: Run non-race CDK IAM policy assertions
        run: make test-cdk-norace

      - name: Run uncached module tests
        run: make test

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-reports
          path: reports/
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'

      - name: Run Docker-backed integration tests
        run: make test-integration

      - name: Run bounded MQTT ingress memory proof
        run: make test-mqtt-ingress-memory

      # TEST-1: a bounded, separate-OS-process, real-broker + DynamoDB Local
      # failover proof on every PR (the full failover/chaos suite still runs
      # only nightly). Catches outage-recovery regressions that default and
      # integration CI would otherwise stay green through.
      - name: Run bounded separate-process failover gate
        run: make test-failover-gate

      - name: Upload integration-test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-test-reports
          path: reports/
          if-no-files-found: ignore

  long-running:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'

      - name: Run long-running release gate
        run: make test-long-running

      - name: Upload long-running reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: long-running-test-reports
          path: reports/
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'

      - name: Install lint tooling
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install github.com/fe3dback/go-arch-lint@v1.15.0
          go install github.com/mibk/dupl@v1.1.0
          go install github.com/jgautheron/goconst/cmd/goconst@v1.10.2

      - name: Run all static checks
        run: make lint

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-reports
          path: reports/
          if-no-files-found: ignore

  # Smoke-build the production runtime image so the Dockerfile cannot rot.
  # No push: this only proves the multi-stage build (static gobridge-filebased
  # on distroless nonroot) still compiles and assembles.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.35.0
          driver-opts: image=moby/buildkit:v0.31.1@sha256:6b59b7df63a8cb9902736f9ddf7fcff8261613d3e7449b8ea8b7537fc399c03a

      - name: Build runtime image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: gobridge-filebased:ci
          build-args: |
            VERSION=ci
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-run healthcheck flag
        run: |
          # No monitor server is running, so the probe must exit non-zero
          # rather than crash — this proves the -healthcheck flag is wired.
          if docker run --rm -e GOBRIDGE_FILEBASED_BOOTSTRAP_JSON='{"bridge_id":"ci","config_file_path":"/var/lib/gobridge/bridge.yaml"}' gobridge-filebased:ci -healthcheck; then
            echo "::error::healthcheck unexpectedly succeeded with no server"
            exit 1
          fi
          echo "healthcheck flag wired (non-zero as expected)"
