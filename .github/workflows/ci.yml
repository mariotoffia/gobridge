name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run non-race CDK IAM policy assertions
        run: make test-cdk-norace

      - name: Run uncached module tests
        run: make test

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: reports/
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run Docker-backed integration tests
        run: make test-integration

      - name: Run bounded MQTT ingress memory proof
        run: |
          set -euo pipefail
          proof_tmp="$GITHUB_WORKSPACE/.tmp-mqtt-memory"
          mkdir -p "$proof_tmp"
          go_cache="$(go env GOCACHE)"
          go_mod_cache="$(go env GOMODCACHE)"
          mkdir -p "$go_cache" "$go_mod_cache"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$go_cache:/root/.cache/go-build" \
            -v "$go_mod_cache:/go/pkg/mod" \
            -w "$GITHUB_WORKSPACE" \
            golang:1.25 \
            # The measured binary uses the production allocator. Race
            # instrumentation has a separate shadow heap and would not measure
            # the configured production ingress bound.
            go test -c -tags=longrunning \
              -o "$proof_tmp/mqtt-memory.test" ./tests/longrunning

          broker_name="gobridge-mqtt-memory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          publisher_name="${broker_name}-publisher"
          network_name="${broker_name}-net"
          cleanup() {
            docker rm -f "$broker_name" >/dev/null 2>&1 || true
            docker rm -f "$publisher_name" >/dev/null 2>&1 || true
            docker network rm "$network_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$network_name"
          docker run -d \
            --name "$broker_name" \
            --network "$network_name" \
            --network-alias mqtt-memory-broker \
            -v "$GITHUB_WORKSPACE/tests/longrunning/testdata/mosquitto-memory.conf:/mosquitto/config/mosquitto.conf:ro" \
            eclipse-mosquitto:latest

          docker run -d \
            --name "$publisher_name" \
            --network "$network_name" \
            --network-alias mqtt-memory-publisher \
            -e GOBRIDGE_MQTT_MEMORY_PUBLISHER_HELPER=1 \
            -e GOBRIDGE_MQTT_MEMORY_PUBLISHER_LISTEN=:1884 \
            -e GOBRIDGE_MQTT_MEMORY_BROKER_URL=tcp://mqtt-memory-broker:1883 \
            -e GOBRIDGE_MQTT_MEMORY_TOPIC=longrunning/ingress-memory \
            -e GOBRIDGE_MQTT_MEMORY_PAYLOAD_BYTES=262144 \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            golang:1.25 \
            "$proof_tmp/mqtt-memory.test" \
              -test.count=1 \
              -test.run '^TestMQTTIngressMemoryPublisherProcess$' \
              -test.timeout=180s

          docker run --rm \
            --memory 512m \
            --memory-swap 512m \
            --network "$network_name" \
            -e GOBRIDGE_REQUIRE_MEMORY_LIMIT=1 \
            -e MQTT_MEMORY_BROKER_URL=tcp://mqtt-memory-broker:1883 \
            -e MQTT_MEMORY_PUBLISHER_CONTROL=mqtt-memory-publisher:1884 \
            -e TMPDIR="$proof_tmp" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            golang:1.25 \
            "$proof_tmp/mqtt-memory.test" \
              -test.count=1 \
              -test.run '^TestMQTTIngressMemory$' \
              -test.timeout=180s \
              -test.v

      - name: Upload integration-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: reports/
          if-no-files-found: ignore

  long-running:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run long-running release gate
        run: make test-long-running

      - name: Upload long-running reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-running-test-reports
          path: reports/
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install lint tooling
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install github.com/fe3dback/go-arch-lint@v1.15.0
          go install github.com/mibk/dupl@v1.1.0
          go install github.com/jgautheron/goconst/cmd/goconst@v1.10.2

      - name: Run all static checks
        run: make lint

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: reports/
          if-no-files-found: ignore

  # Smoke-build the production runtime image so the Dockerfile cannot rot.
  # No push: this only proves the multi-stage build (static gobridge-filebased
  # on distroless nonroot) still compiles and assembles.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gobridge-filebased:ci
          build-args: |
            VERSION=ci
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-run healthcheck flag
        run: |
          # No monitor server is running, so the probe must exit non-zero
          # rather than crash — this proves the -healthcheck flag is wired.
          if docker run --rm -e GOBRIDGE_FILEBASED_BOOTSTRAP_JSON='{"bridge_id":"ci","config_file_path":"/var/lib/gobridge/bridge.yaml"}' gobridge-filebased:ci -healthcheck; then
            echo "::error::healthcheck unexpectedly succeeded with no server"
            exit 1
          fi
          echo "healthcheck flag wired (non-zero as expected)"
