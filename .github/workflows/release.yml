name: Release

on:
  push:
    tags:
      # Core module:            v1.2.3
      - 'v*'
      # Any adapter module:     adapters/aws/transport/sqs/v1.2.3
      - 'adapters/**'
      # Any processor module:   processors/filter/v1.2.3
      - 'processors/**'
      # Deployment modules:      deployment/aws-filebased-config/cdk/v1.2.3
      - 'deployment/**'

permissions:
  contents: write
  packages: write

jobs:
  module-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Determine module
        id: module
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          # The version is always the final path segment (vX.Y.Z). Everything
          # before it is the module path relative to the repo root; a bare
          # vX.Y.Z tag releases the core (root) module.
          VERSION="${TAG##*/}"
          if [[ "$TAG" == "$VERSION" ]]; then
            MODULE_PATH="."
            IMPORT_PATH="github.com/mariotoffia/gobridge"
          else
            MODULE_PATH="${TAG%/*}"
            IMPORT_PATH="github.com/mariotoffia/gobridge/${MODULE_PATH}"
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            echo "::error::tag '$TAG' does not end in a semantic version (vX.Y.Z)"
            exit 1
          fi
          if [[ "$MODULE_PATH" != "." && ! -f "$MODULE_PATH/go.mod" ]]; then
            echo "::error::no go.mod at '$MODULE_PATH' — tag does not match a module"
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "path=$MODULE_PATH"
            echo "import=$IMPORT_PATH"
          } >> "$GITHUB_OUTPUT"

      - name: Verify build (${{ steps.module.outputs.path }})
        working-directory: ${{ steps.module.outputs.path }}
        env:
          GOWORK: off
        run: |
          go mod download
          go build ./...
          go test ./...

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.module.outputs.import }} ${{ steps.module.outputs.version }}
          body: |
            ## Module Release

            **Module:** `${{ steps.module.outputs.import }}`
            **Version:** ${{ steps.module.outputs.version }}
            **Tag:** ${{ steps.module.outputs.tag }}

            ### Installation

            ```bash
            go get ${{ steps.module.outputs.import }}@${{ steps.module.outputs.version }}
            ```
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the production runtime container image on core (root-module) tags.
  # The seeder is the upstream public.ecr.aws/aws-cli image (pinned by digest in
  # cdk/constructs/internal/seeder/image.txt via `make update-seeder-image`), so
  # no seeder image is built here.
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mariotoffia/gobridge:${{ steps.ver.outputs.version }}
            ghcr.io/mariotoffia/gobridge:latest
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
