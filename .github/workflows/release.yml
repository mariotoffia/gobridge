name: Release

on:
  push:
    tags:
      # The verifier, not this broad trigger, is the canonical allow-list.
      # Internal, unknown, moved, and non-stable tags fail before publication.
      - 'v*'
      - '**/v*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.module.outputs.tag }}
      version: ${{ steps.module.outputs.version }}
      path: ${{ steps.module.outputs.path }}
      import: ${{ steps.module.outputs.import }}
      layer: ${{ steps.module.outputs.layer }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'

      - name: Validate tag, origins, release order, manifest, and module
        id: module
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          make --no-print-directory verify-release-tag \
            RELEASE_TAG="$RELEASE_TAG" | tee -a "$GITHUB_OUTPUT"

      # The final module repeats the strict gate over all declared modules and
      # binds every public module Origin.Hash to its exact local tag commit.
      - name: Verify the complete published module train
        if: steps.module.outputs.path == 'cmd/gobridge'
        env:
          RELEASE_VERSION: ${{ steps.module.outputs.version }}
        run: make verify-published-modules RELEASE_VERSION="$RELEASE_VERSION"

  external-consumer-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out final tagged source
        if: needs.validate.outputs.path == 'cmd/gobridge'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Go
        if: needs.validate.outputs.path == 'cmd/gobridge'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'

      - name: Resolve Paho and install gobridge outside the workspace
        if: needs.validate.outputs.path == 'cmd/gobridge'
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: make smoke-released-modules RELEASE_TAG="$RELEASE_TAG"

      - name: No external smoke required for this module
        if: needs.validate.outputs.path != 'cmd/gobridge'
        run: echo "External consumer smoke is gated by the final cmd/gobridge module."

  github-release:
    needs:
      - validate
      - external-consumer-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create module GitHub Release after all applicable gates
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ needs.validate.outputs.import }} ${{ needs.validate.outputs.version }}
          body: |
            ## Module Release

            **Module:** `${{ needs.validate.outputs.import }}`
            **Version:** ${{ needs.validate.outputs.version }}
            **Tag:** ${{ needs.validate.outputs.tag }}

            ### Installation

            ```bash
            go get ${{ needs.validate.outputs.import }}@${{ needs.validate.outputs.version }}
            ```
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs:
      - validate
      - external-consumer-smoke
      - github-release
    if: >-
      needs.validate.outputs.path == 'cmd/gobridge' &&
      needs.external-consumer-smoke.result == 'success' &&
      needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: gobridge-image-promotion
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out final tagged source and all tags
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up pinned QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:6b59b7df63a8cb9902736f9ddf7fcff8261613d3e7449b8ea8b7537fc399c03a
          platforms: arm64

      - name: Set up pinned Docker Buildx and BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.35.0
          driver-opts: image=moby/buildkit:v0.31.1@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find resumable commit-scoped candidate
        id: candidate
        env:
          CANDIDATE: ghcr.io/mariotoffia/gobridge:candidate-${{ github.sha }}
        run: |
          set -euo pipefail
          if output="$(docker buildx imagetools inspect \
            "$CANDIDATE" --format '{{.Manifest.Digest}}' 2>&1)"; then
            if [[ ! "$output" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::candidate returned invalid digest '$output'"
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$output" >> "$GITHUB_OUTPUT"
            echo "Resuming existing candidate $CANDIDATE@$output"
          elif grep -Eiq '(manifest unknown|name unknown|404 Not Found|MANIFEST_UNKNOWN|NAME_UNKNOWN)' <<<"$output"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::candidate inspect failed (not a NOT_FOUND): $output"
            exit 1
          fi

      - name: Build and push commit-scoped candidate
        if: steps.candidate.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mariotoffia/gobridge:candidate-${{ github.sha }}
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            GIT_SHA=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve and validate candidate digest
        id: image
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          digest="$BUILT_DIGEST"
          if [ -z "$digest" ]; then
            digest="$EXISTING_DIGEST"
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::candidate has invalid digest '$digest'"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Inspect candidate platform children
        id: children
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE: ghcr.io/mariotoffia/gobridge
        run: |
          set -euo pipefail
          raw="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw)"
          amd64_count="$(jq '[.manifests[] |
            select(.platform.os == "linux" and .platform.architecture == "amd64")] |
            length' <<<"$raw")"
          arm64_count="$(jq '[.manifests[] |
            select(.platform.os == "linux" and .platform.architecture == "arm64")] |
            length' <<<"$raw")"
          if [ "$amd64_count" -ne 1 ] || [ "$arm64_count" -ne 1 ]; then
            echo "::error::candidate must contain exactly one linux/amd64 and one linux/arm64 image"
            exit 1
          fi
          amd64="$(jq -r '.manifests[] |
            select(.platform.os == "linux" and .platform.architecture == "amd64") |
            .digest' <<<"$raw")"
          arm64="$(jq -r '.manifests[] |
            select(.platform.os == "linux" and .platform.architecture == "arm64") |
            .digest' <<<"$raw")"
          for digest in "$amd64" "$arm64"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::candidate child has invalid digest '$digest'"
              exit 1
            fi
          done
          echo "amd64=$amd64" >> "$GITHUB_OUTPUT"
          echo "arm64=$arm64" >> "$GITHUB_OUTPUT"

      - name: Scan linux/amd64 child
        # trivy-action v0.36.0, pinned to its verified release commit.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/mariotoffia/gobridge@${{ steps.children.outputs.amd64 }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          timeout: 10m

      - name: Scan linux/arm64 child
        # trivy-action v0.36.0, pinned to its verified release commit.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/mariotoffia/gobridge@${{ steps.children.outputs.arm64 }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          timeout: 10m

      - name: Refuse or resume stable semver tag, then promote by digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE: ghcr.io/mariotoffia/gobridge
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          stable="$IMAGE:$VERSION"
          if output="$(docker buildx imagetools inspect \
            "$stable" --format '{{.Manifest.Digest}}' 2>&1)"; then
            if [ "$output" != "$DIGEST" ]; then
              echo "::error::$stable already points to $output, not $DIGEST"
              exit 1
            fi
            echo "$stable already points to the scanned digest; resuming."
          elif grep -Eiq '(manifest unknown|name unknown|404 Not Found|MANIFEST_UNKNOWN|NAME_UNKNOWN)' <<<"$output"; then
            docker buildx imagetools create --tag "$stable" "$IMAGE@$DIGEST"
          else
            echo "::error::stable tag inspect failed (not a NOT_FOUND): $output"
            exit 1
          fi
          promoted="$(docker buildx imagetools inspect \
            "$stable" --format '{{.Manifest.Digest}}')"
          if [ "$promoted" != "$DIGEST" ]; then
            echo "::error::$stable resolved to '$promoted', want '$DIGEST'"
            exit 1
          fi

      - name: Re-check ordering and promote latest only for the highest stable version
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE: ghcr.io/mariotoffia/gobridge
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          decision="$(make --no-print-directory release-latest-version \
            RELEASE_VERSION="$RELEASE_VERSION")"
          printf '%s\n' "$decision"
          promote="$(awk -F= '$1 == "promote" { print $2 }' <<<"$decision")"
          highest="$(awk -F= '$1 == "highest" { print $2 }' <<<"$decision")"
          if [ "$promote" = "true" ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
            promoted="$(docker buildx imagetools inspect \
              "$IMAGE:latest" --format '{{.Manifest.Digest}}')"
            if [ "$promoted" != "$DIGEST" ]; then
              echo "::error::latest resolved to '$promoted', want '$DIGEST'"
              exit 1
            fi
          else
            echo "$RELEASE_VERSION is older than $highest; latest remains unchanged."
          fi
