name: Release

on:
  push:
    tags:
      # The verifier, not this broad trigger, is the canonical allow-list.
      # Internal, unknown, moved, and non-stable tags fail before publication.
      - 'v*'
      - '**/v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require protected creation-only tag event
        env:
          CREATED: ${{ github.event.created }}
          DELETED: ${{ github.event.deleted }}
          FORCED: ${{ github.event.forced }}
          PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [ "$CREATED" != "true" ] ||
            [ "$DELETED" != "false" ] ||
            [ "$FORCED" != "false" ] ||
            [ "$PROTECTED" != "true" ]; then
            echo "::error::release requires a protected, non-forced tag creation event"
            exit 1
          fi

  validate:
    needs: tag-policy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.module.outputs.tag }}
      version: ${{ steps.module.outputs.version }}
      path: ${{ steps.module.outputs.path }}
      import: ${{ steps.module.outputs.import }}
      layer: ${{ steps.module.outputs.layer }}
      commit: ${{ steps.module.outputs.commit }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'

      - name: Validate tag, origins, release order, manifest, and module
        id: module
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          make --no-print-directory verify-release-tag \
            RELEASE_TAG="$RELEASE_TAG" | tee -a "$GITHUB_OUTPUT"

      # The final module repeats the strict gate over all declared modules and
      # binds every public module Origin.Hash to its exact local tag commit.
      - name: Verify the complete published module train
        if: steps.module.outputs.path == 'cmd/gobridge'
        env:
          RELEASE_VERSION: ${{ steps.module.outputs.version }}
        run: make verify-published-modules RELEASE_VERSION="$RELEASE_VERSION"

  external-consumer-smoke:
    needs:
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out final tagged source
        if: needs.validate.outputs.path == 'cmd/gobridge'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Go
        if: needs.validate.outputs.path == 'cmd/gobridge'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'

      - name: Resolve Paho and install gobridge outside the workspace
        if: needs.validate.outputs.path == 'cmd/gobridge'
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: make smoke-released-modules RELEASE_TAG="$RELEASE_TAG"

      - name: No external smoke required for this module
        if: needs.validate.outputs.path != 'cmd/gobridge'
        run: echo "External consumer smoke is gated by the final cmd/gobridge module."

  github-release:
    needs:
      - validate
      - external-consumer-smoke
    # One release per version, not one per module. Every module still gets its
    # tag, its strict verification and its proxy check; only the root module
    # gets a human-facing Release page, because 40 of them is noise nobody
    # reads and the root tag is the version users actually pin.
    if: needs.validate.outputs.path == '.'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Re-resolve protected remote tag before GitHub Release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
          ORIGINAL_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const expected = process.env.EXPECTED_COMMIT;
            const original = process.env.ORIGINAL_SHA;
            const tag = process.env.RELEASE_TAG;
            const {owner, repo} = context.repo;
            if (expected !== original) {
              throw new Error(`validated commit ${expected} differs from ${original}`);
            }
            const ref = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
            let object = ref.data.object;
            for (let depth = 0; depth < 8 && object.type === 'tag'; depth++) {
              const annotated = await github.rest.git.getTag({
                owner,
                repo,
                tag_sha: object.sha,
              });
              object = annotated.data.object;
            }
            if (object.type !== 'commit' || object.sha !== expected) {
              throw new Error(
                `remote tag ${tag} resolves to ${object.type}:${object.sha}, ` +
                `want commit:${expected}`,
              );
            }

      - name: Create module GitHub Release after all applicable gates
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ needs.validate.outputs.import }} ${{ needs.validate.outputs.version }}
          body: |
            ## Module Release

            **Module:** `${{ needs.validate.outputs.import }}`
            **Version:** ${{ needs.validate.outputs.version }}
            **Tag:** ${{ needs.validate.outputs.tag }}

            ### Installation

            ```bash
            go get ${{ needs.validate.outputs.import }}@${{ needs.validate.outputs.version }}
            ```
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

